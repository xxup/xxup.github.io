<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>JS错误诊断器</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #ddd;
         font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 12px 16px; background: #1b1b1b; border-bottom: 1px solid #333;
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 14px; margin: 0 12px 0 0; color: #0f0; font-weight: 600; white-space: nowrap; }
  input[type=text] { flex: 1 1 320px; min-width: 220px; padding: 6px 10px;
                     background: #000; border: 1px solid #333; color: #0f0;
                     font-family: monospace; font-size: 13px; border-radius: 4px; }
  button { padding: 6px 14px; background: #0f0; color: #000; border: 0;
           border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { font-family: monospace; font-size: 12px; color: #888; }
  #panel { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           font-size: 12px; line-height: 1.55; padding: 12px 16px;
           white-space: pre-wrap; word-break: break-word; }
  .line { padding: 1px 0; }
  .ok { color: #4c4; }  .warn { color: #fa0; }
  .err { color: #f66; } .info { color: #8cf; } .dim { color: #777; }
  .stack { margin: 3px 0 8px 16px; padding-left: 8px; border-left: 2px solid #333; color: #9a9a9a; }
  .frame-file { color: #8cf; } .frame-line { color: #fa0; font-weight: 600; }
  .hit { background: #2a1a1a; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 3px;
           font-size: 11px; margin-right: 6px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>JS 错误诊断器</h1>
  <input id="src" type="text" spellcheck="false"
         placeholder="脚本路径，如 js/script.js 或 /js/script.js">
  <button id="run">开始诊断</button>
  <span id="status">就绪</span>
</header>
<div id="panel"></div>

<script>
(function () {
  "use strict";

  var $src = document.getElementById("src");
  var $run = document.getElementById("run");
  var $panel = document.getElementById("panel");
  var $status = document.getElementById("status");

  $src.value = "js/script.js";
  var targetFile = "";
  var done = false;
  var t0 = 0;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function add(html, cls) {
    var div = document.createElement("div");
    div.className = "line " + (cls || "");
    div.innerHTML = html;
    $panel.appendChild(div);
    $panel.scrollTop = $panel.scrollHeight;
    return div;
  }
  function setStatus(s) { $status.textContent = s; }

  function parseStack(stack) {
    if (!stack) return [];
    var frames = [];
    String(stack).split("\n").forEach(function (raw) {
      var line = raw.replace(/\r$/, "").trim();
      if (!line) return;
      if (/^[A-Za-z]*Error\b/.test(line) && line.indexOf("@") === -1) return; // 跳过首行错误名
      var m = /^at\s+(.*?)\s*\((.+?):(\d+):(\d+)\)$/.exec(line);
      if (m) { frames.push({ fn: m[1], url: m[2], line: +m[3], col: +m[4] }); return; }
      m = /^at\s+(.+?):(\d+):(\d+)$/.exec(line);
      if (m) { frames.push({ fn: "", url: m[1], line: +m[2], col: +m[3] }); return; }
      m = /^(.*?)@(.+?):(\d+):(\d+)$/.exec(line);
      if (m) { frames.push({ fn: m[1], url: m[2], line: +m[3], col: +m[4] }); return; }
      frames.push({ raw: line });
    });
    return frames;
  }
  function isTarget(url) {
    if (!url || !targetFile) return false;
    var base = targetFile.replace(/^.*\//, "");
    return url.indexOf(targetFile) !== -1 || url.indexOf(base) !== -1;
  }
  function renderStack(stack) {
    var frames = parseStack(stack);
    if (!frames.length) return "";
    var html = '<div class="stack">';
    frames.slice(0, 12).forEach(function (f) {
      if (f.raw) { html += "<div>" + esc(f.raw) + "</div>"; return; }
      var hit = isTarget(f.url);
      var loc = hit
        ? '<span class="frame-file">' + esc(f.url) + '</span>:<span class="frame-line">' + f.line + ":" + f.col + "</span>"
        : esc(f.url) + ":" + f.line + ":" + f.col;
      html += '<div class="' + (hit ? "hit" : "") + '">' +
              (f.fn ? esc(f.fn) + " @ " : "") + loc + "</div>";
    });
    return html + "</div>";
  }

  function onWindowError(e) {
    if (e.target && e.target !== window && e.target.tagName === "SCRIPT") {
      add('<span class="badge" style="background:#f66;color:#000">LOAD</span> ' +
          "脚本加载失败（404 / 路径 / CORS / CSP）: " + esc(e.target.src), "err");
      finish("加载失败");
      return;
    }
    var fname = e.filename || "";
    var msg = e.message || (e.error && e.error.message) || "";
    var masked = !msg || msg === "Script error.";
    var hit = isTarget(fname);
    var html = '<span class="badge" style="background:#f66;color:#000">ERROR</span> ' +
      esc(masked ? "Script error.（错误信息被浏览器脱敏）" : msg) +
      '<div class="dim">@ ' + esc(fname || "?") + ":" +
      (e.lineno || "?") + ":" + (e.colno || "?") + "</div>";
    if (masked) {
      html += '<div class="warn">跨域或 file:// 下错误被脱敏，拿不到行号。' +
              "请用本地 HTTP 服务器或同源部署。</div>";
    }
    if (e.error && e.error.stack) html += renderStack(e.error.stack);
    add(html, "err" + (hit ? " hit" : ""));
    finish("发现错误");
  }

  function onRejection(e) {
    var r = e.reason;
    var msg = (r && r.message) || (typeof r === "string" ? r : (function () {
      try { return JSON.stringify(r); } catch (_) { return String(r); }
    })());
    var html = '<span class="badge" style="background:#f80;color:#000">REJECT</span> ' + esc(msg);
    if (r && r.stack) html += renderStack(r.stack);
    add(html, "err");
    finish("发现未处理拒绝");
  }

  window.addEventListener("error", onWindowError, true);
  window.addEventListener("unhandledrejection", onRejection);

  function finish(reason) {
    if (done) return;
    done = true;
    $run.disabled = false;
    var ms = Math.round(performance.now() - t0);
    setStatus("完成 (" + ms + "ms)");
    add('<span class="dim">=== 诊断结束：' + esc(reason) + "（" + ms + "ms）===</span>", "dim");
  }

  function syntaxCheck(url) {
    if (location.protocol === "file:") {
      add('<span class="warn">跳过语法预检：file:// 下 fetch 不可用，请用本地 HTTP 服务器。</span>', "warn");
      return Promise.resolve();
    }
    return fetch(url, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
        return r.text();
      })
      .then(function (code) {
        try {
          new Function(code); 
          add('<span class="badge" style="background:#4c4;color:#000">SYNTAX</span> 语法预检通过', "ok");
        } catch (e) {
          add('<span class="badge" style="background:#f66;color:#000">SYNTAX</span> 语法错误: ' + esc(e.message), "err");
          var m = /\(at\s+([^:)]+):(\d+):(\d+)\)/.exec(e.message || "");
          if (m) add('<div class="dim">→ 定位 ' + esc(m[1]) + ":" + m[2] + ":" + m[3] + "</div>", "dim");
        }
      })
      .catch(function (e) {
        add('<span class="warn">语法预检失败（不影响执行诊断）: ' + esc(e.message) + "</span>", "warn");
      });
  }

  function diagnose() {
    var raw = ($src.value || "").trim();
    if (!raw) { setStatus("请填写脚本路径"); return; }

    $panel.innerHTML = "";
    done = false;
    $run.disabled = true;
    setStatus("诊断中…");
    t0 = performance.now();

    targetFile = raw.replace(/[?#].*$/, "");
    var abs = raw;
    try { abs = new URL(raw, location.href).href; } catch (_) {}

    add('<span class="info">[诊断开始]</span> 页面协议: ' + esc(location.protocol), "info");
    add('<div class="dim">目标: ' + esc(abs) + "</div>", "dim");
    if (location.protocol === "file:") {
      add('<div class="warn">file:// 提示：脚本能加载，但错误可能被脱敏为 "Script error." 且行号丢失。' +
          "建议用本地 HTTP 服务器（如 npx serve / python -m http.server）。</div>", "warn");
    }
    add('<div class="warn">注意：诊断页是空 DOM，若脚本依赖页面特定元素，' +
        "可能报出与业务无关的 null 错误。</div>", "warn");

    syntaxCheck(raw);

    var s = document.createElement("script");
    s.src = raw + (raw.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now();
    s.async = false;
    s.onload = function () {
      add('<span class="badge" style="background:#4c4;color:#000">LOAD</span> ' +
          "下载完成（load 触发 ≠ 无错误，错误看 ERROR 行）", "ok");
      setTimeout(function () { finish("执行完成，暂未捕获错误（异步回调中的错误可能稍后出现）"); }, 300);
    };
    s.onerror = function () {
      add('<span class="badge" style="background:#f66;color:#000">LOAD</span> ' +
          "无法加载脚本（404 / 路径 / CORS / CSP）: " + esc(abs), "err");
      finish("加载失败");
    };
    (document.head || document.documentElement).appendChild(s);
  }

  $run.addEventListener("click", diagnose);
  $src.addEventListener("keydown", function (e) { if (e.key === "Enter") diagnose(); });

  add('<span class="dim">填写 script.js 路径后点「开始诊断」。语法错误、运行错误、未处理 Promise、行号与调用栈都会显示在此。</span>', "dim");
})();
</script>
</body>
</html>
