<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, minimum-scale=1.0,
               user-scalable=no, viewport-fit=cover,
               interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>网站探针 · Web Probe (B 模式)</title>
<style>
  :root { --app-h: 100dvh; --app-top: 0px; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { width: 100%; height: 100%; height: -webkit-fill-available; overflow: hidden;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    position: fixed; top: 0; left: 0; right: 0; width: 100%;
    height: var(--app-h, 100dvh);
    transform: translateY(var(--app-top, 0px));
    overflow: hidden; display: flex; flex-direction: column;
    background: #0a0a0a; color: #0f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55;
    touch-action: manipulation; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #panel { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid #222; }
  #toolbar {
    flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 10px;
    padding-top: calc(8px + env(safe-area-inset-top));
    padding-left: calc(10px + env(safe-area-inset-left));
    padding-right: calc(10px + env(safe-area-inset-right));
    background: #111; border-bottom: 1px solid #1e1e1e; font-size: 12px; color: #888;
  }
  #toolbar .title { flex: 1; color: #0f0; font-weight: bold; min-width: 80px; }
  #toolbar .badge {
    padding: 2px 8px; border-radius: 10px; font-size: 11px;
    background: #222; color: #888; border: 1px solid #333;
  }
  #toolbar .badge.b { background: #052; color: #0f0; border-color: #0a0; }
  #toolbar .badge.a { background: #210; color: #fa0; border-color: #fa0; }
  #toolbar button {
    padding: 6px 10px; border: 1px solid #333; border-radius: 8px;
    background: #000; color: #999; font: inherit; font-size: 12px;
    cursor: pointer; touch-action: manipulation;
    transition: background .12s, border-color .12s, transform .08s, color .12s;
    -webkit-user-select: none; user-select: none;
    transform-origin: center center;
    font-variant-numeric: tabular-nums;
  }
  #toolbar button:active, #toolbar button.is-pressed {
    background: #2a2a2a; border-color: #0a0; color: #0f0; transform: scale(0.96);
  }
  #toolbar button:disabled { opacity: .4; }
  #toolbar button:disabled:active, #toolbar button:disabled.is-pressed {
    background: #000; border-color: #333; color: #999; transform: none;
  }
  @keyframes btnFlash {
    0% { background: #0a0; border-color: #0f0; color: #fff; transform: scale(0.94); }
    100% { background: #000; border-color: #333; color: #999; transform: scale(1); }
  }
  #toolbar button.is-flash { animation: btnFlash .35s ease; }
  #output {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    white-space: pre-wrap; word-break: break-all;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y; overscroll-behavior: contain;
    -webkit-user-select: text; user-select: text;
  }
  #output .row { display: block; padding: 1px 0; }
  #output .ts { color: #555; }
  #output .head { font-weight: bold; }
  #footer {
    flex: none; display: flex; gap: 8px; align-items: stretch;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #111; border-top: 1px solid #222;
  }
  #urlInput {
    flex: 1; min-width: 0; padding: 12px 14px;
    background: #000; color: #0f0;
    border: 1px solid #2a2a2a; border-radius: 10px;
    font: inherit; font-size: 16px; outline: none;
    touch-action: manipulation;
    -webkit-user-select: text; user-select: text;
    -webkit-appearance: none; appearance: none;
  }
  #urlInput:focus { border-color: #0a0; box-shadow: 0 0 0 2px rgba(0,170,0,.15); }
  #urlInput::placeholder { color: #444; }
  #btnProbe {
    flex: none; padding: 12px 18px; border: 0; border-radius: 10px;
    background: #0a0; color: #fff;
    font: inherit; font-size: 15px; font-weight: bold;
    cursor: pointer; min-width: 96px;
    touch-action: manipulation;
    transition: background .15s, transform .08s;
    -webkit-user-select: none; user-select: none;
  }
  #btnProbe:active { background: #080; transform: scale(0.97); }
  #btnProbe:disabled { background: #263; color: #888; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<section id="panel">
  <div id="toolbar">
    <span class="title">● 探针输出</span>
    <span id="modeBadge" class="badge">待探测</span>
    <button id="btnNetwork" type="button">网络</button>
    <button id="btnStorage" type="button">存储</button>
    <button id="btnExport" type="button" disabled>导出</button>
    <button id="btnClear" type="button">清空</button>
  </div>
  <div id="output" role="log" aria-live="polite"></div>
</section>

<footer id="footer">
  <input id="urlInput" type="text"
         inputmode="url" autocomplete="off"
         autocorrect="off" autocapitalize="off" spellcheck="false"
         enterkeyhint="go"
         placeholder="输入网址，如 /index.html 或 https://同源域名/path">
  <button id="btnProbe" type="button">开始探测</button>
</footer>

<script>
/* =============================================================
   [iOS-C] 视口锁定 + 防缩放 + 键盘紧贴
   ============================================================= */
(function lockViewportAndZoom() {
  const root = document.documentElement;
  let rafId = 0;
  function syncHeight() {
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      const vv = window.visualViewport;
      if (!vv) {
        root.style.setProperty("--app-h", window.innerHeight + "px");
        root.style.setProperty("--app-top", "0px");
        return;
      }
      const diff = Math.abs(window.innerHeight - vv.height - vv.offsetTop);
      if (diff < 2) {
        root.style.setProperty("--app-h", "100dvh");
        root.style.setProperty("--app-top", "0px");
      } else {
        root.style.setProperty("--app-h", vv.height + "px");
        root.style.setProperty("--app-top", vv.offsetTop + "px");
      }
    });
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncHeight);
    window.visualViewport.addEventListener("scroll", syncHeight);
  }
  window.addEventListener("resize", syncHeight);
  window.addEventListener("orientationchange", () => setTimeout(syncHeight, 200));
  document.addEventListener("focusin", (e) => {
    if (e.target && e.target.tagName === "INPUT") {
      syncHeight();
      setTimeout(syncHeight, 100);
      setTimeout(syncHeight, 250);
      setTimeout(syncHeight, 400);
    }
  }, true);
  document.addEventListener("focusout", (e) => {
    if (e.target && e.target.tagName === "INPUT") {
      syncHeight();
      setTimeout(syncHeight, 100);
      setTimeout(syncHeight, 250);
    }
  }, true);
  syncHeight();
  ["gesturestart", "gesturechange", "gestureend"].forEach((evt) => {
    document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
  });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener("wheel", (e) => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });
  let lastEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastEnd <= 300) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
})();

/* =============================================================
   [iOS-D] 点击空白收起键盘
   ============================================================= */
(function tapToDismissKeyboard() {
  const INTERACTIVE = "input,textarea,select,button,a[href],[role='button'],[contenteditable=''],[contenteditable='true']";
  const isInteractive = (el) => !!(el && el.closest && el.closest(INTERACTIVE));
  const dismiss = () => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) ae.blur();
  };
  let startX = 0, startY = 0, tracking = false;
  const handleEnd = (target, x, y) => {
    if (!tracking) return;
    tracking = false;
    if (Math.abs(x - startX) > 8 || Math.abs(y - startY) > 8) return;
    if (isInteractive(target)) return;
    dismiss();
  };
  if (window.PointerEvent) {
    document.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      startX = e.clientX; startY = e.clientY; tracking = true;
    }, { passive: true });
    document.addEventListener("pointerup", (e) => handleEnd(e.target, e.clientX, e.clientY), { passive: true });
    document.addEventListener("pointercancel", () => { tracking = false; }, { passive: true });
    document.addEventListener("click", (e) => {
      if (e.pointerType === undefined && !isInteractive(e.target)) dismiss();
    }, { passive: true });
  } else {
    document.addEventListener("touchstart", (e) => {
      const t = e.touches[0] || e.changedTouches[0];
      if (t) { startX = t.clientX; startY = t.clientY; tracking = true; }
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      if (t) handleEnd(e.target, t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener("touchcancel", () => { tracking = false; }, { passive: true });
    document.addEventListener("click", (e) => { if (!isInteractive(e.target)) dismiss(); }, { passive: true });
  }
})();

/* =============================================================
   [INJECTED] 注入到目标页 iframe 内的采集脚本（自包含）
   ============================================================= */
function injectedProbe(config) {
  var ID = config.id;
  var start = performance.now();
  var MAX_PER_TYPE = 200;
  var counts = {};

  function send(type, data) {
    if ((counts[type] = (counts[type] || 0) + 1) > MAX_PER_TYPE) return;
    try {
      window.parent.postMessage({
        __probe: true, id: ID, type: type,
        t: Math.round(performance.now() - start),
        data: data
      }, "*");
    } catch (e) {}
  }

  // ============ L8: 应用错误 ============
  window.addEventListener("error", function (e) {
    if (e.target && e.target !== window) return;
    var err = e.error;
    send("js-error", {
      message: e.message || "(unknown)",
      filename: e.filename || "?",
      lineno: e.lineno || 0,
      colno: e.colno || 0,
      stack: err && err.stack ? String(err.stack).slice(0, 1500) : ""
    });
  });

  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    send("promise-rejection", {
      message: (r && r.message) || String(r),
      stack: r && r.stack ? String(r.stack).slice(0, 1500) : ""
    });
  });

  window.addEventListener("error", function (e) {
    var t = e.target;
    if (!t || t === window) return;
    var tag = t.tagName;
    if (["SCRIPT","LINK","IMG","VIDEO","AUDIO","SOURCE"].indexOf(tag) < 0) return;
    send("res-error", { tag: tag, url: t.src || t.href || "" });
  }, true);

  // ============ L7: 运行时网络（PerformanceObserver，不劫持 fetch） ============
  try {
    var seen = {};
    function pushResource(e) {
      if (seen[e.name]) return;
      seen[e.name] = 1;
      send("resource", {
        name: e.name,
        initiatorType: e.initiatorType || "?",
        duration: Math.round(e.duration),
        transferSize: e.transferSize || 0,
        decodedBodySize: e.decodedBodySize || 0,
        startTime: Math.round(e.startTime)
      });
    }
    // 先补捞已发生的
    performance.getEntriesByType("resource").forEach(pushResource);
    // 再实时观察
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(pushResource);
    }).observe({ type: "resource", buffered: true });
  } catch (e) {}

  // ============ L9: 性能全量 ============
  try {
    var nav = performance.getEntriesByType("navigation")[0];
    if (nav) {
      send("navigation", {
        dns: Math.round(nav.domainLookupEnd - nav.domainLookupStart),
        tcp: Math.round(nav.connectEnd - nav.connectStart),
        tls: nav.secureConnectionStart ? Math.round(nav.connectEnd - nav.secureConnectionStart) : 0,
        ttfb: Math.round(nav.responseStart - nav.requestStart),
        download: Math.round(nav.responseEnd - nav.responseStart),
        domInteractive: Math.round(nav.domInteractive),
        domContentLoaded: Math.round(nav.domContentLoadedEventEnd),
        load: Math.round(nav.loadEventEnd),
        transferSize: nav.transferSize || 0,
        decodedBodySize: nav.decodedBodySize || 0
      });
    }
  } catch (e) {}

  try {
    var lastLCP = 0;
    new PerformanceObserver(function (list) {
      var es = list.getEntries();
      var last = es[es.length - 1];
      if (last && last.startTime > lastLCP) {
        lastLCP = last.startTime;
        send("lcp", {
          value: Math.round(lastLCP),
          element: last.element && last.element.tagName ? last.element.tagName : ""
        });
      }
    }).observe({ type: "largest-contentful-paint", buffered: true });
  } catch (e) {}

  try {
    var clsVal = 0, lastCLS = -1;
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (e) { if (!e.hadRecentInput) clsVal += e.value; });
      var v = Math.round(clsVal * 1000) / 1000;
      if (v !== lastCLS) { lastCLS = v; send("cls", { value: v }); }
    }).observe({ type: "layout-shift", buffered: true });
  } catch (e) {}

  try {
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (e) {
        if (e.duration > 50) send("longtask", {
          duration: Math.round(e.duration), start: Math.round(e.startTime)
        });
      });
    }).observe({ type: "longtask", buffered: true });
  } catch (e) {}

  try {
    new PerformanceObserver(function (list) {
      list.getEntries().forEach(function (e) {
        if (e.duration > 100) send("inp", {
          name: e.name, duration: Math.round(e.duration)
        });
      });
    }).observe({ type: "event", buffered: true, durationThreshold: 104 });
  } catch (e) {}

  // ============ L10: 真实 DOM 摘要 ============
  function domSummary() {
    try {
      send("dom-summary", {
        title: document.title || "(空)",
        url: location.href,
        readyState: document.readyState,
        scripts: document.querySelectorAll("script").length,
        stylesheets: document.styleSheets.length,
        images: document.images.length,
        links: document.querySelectorAll("a[href]").length,
        forms: document.querySelectorAll("form").length,
        inputs: document.querySelectorAll("input,textarea,select").length,
        iframes: document.querySelectorAll("iframe").length,
        bodyHeight: document.body ? document.body.scrollHeight : 0,
        bodyWidth: document.body ? document.body.scrollWidth : 0
      });
    } catch (e) {}
  }
  if (document.readyState === "complete") setTimeout(domSummary, 100);
  else window.addEventListener("load", function () { setTimeout(domSummary, 100); });

  // ============ 存储摘要 ============
  try {
    var ls = { count: localStorage.length, bytes: 0, keys: [] };
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var v = localStorage.getItem(k) || "";
      ls.bytes += k.length + v.length;
      if (ls.keys.length < 20) ls.keys.push(k);
    }
    var ss = { count: sessionStorage.length, bytes: 0 };
    for (var j = 0; j < sessionStorage.length; j++) {
      var k2 = sessionStorage.key(j);
      var v2 = sessionStorage.getItem(k2) || "";
      ss.bytes += k2.length + v2.length;
    }
    send("storage", { local: ls, session: ss });
  } catch (e) {}

  // ============ 通知父页面：就绪 ============
  send("ready", { url: location.href, ua: navigator.userAgent });
}

/* =============================================================
   [F12-HOOK] 父页面自身的 F12 诊断（探针自身也会报错时用）
   ============================================================= */
function installDevToolsLike(log, onNetPush) {
  window.addEventListener("error", (e) => {
    if (e.target && e.target !== window) return;
    const err = e.error;
    const stack = err && err.stack ? String(err.stack).slice(0, 800) : "";
    try {
      log("[PARENT-JS-ERR] " + (e.message || "?") +
          "\n  at " + (e.filename || "?") + ":" + (e.lineno || "?") +
          (stack ? "\n" + stack : ""), "#f66");
    } catch (_) {}
  });
  window.addEventListener("unhandledrejection", (e) => {
    const r = e.reason;
    try {
      log("[PARENT-PROMISE] " + ((r && r.message) || r) +
          (r && r.stack ? "\n" + String(r.stack).slice(0, 800) : ""), "#f66");
    } catch (_) {}
  });
  const netLog = [];
  const NET_CAP = 200;
  function pushNet(rec) {
    netLog.push(rec);
    if (netLog.length > NET_CAP) netLog.shift();
    if (onNetPush) { try { onNetPush(netLog.length); } catch (_) {} }
  }
  (function hookFetch() {
    const origFetch = window.fetch;
    window.fetch = async function (...args) {
      const url = typeof args[0] === "string" ? args[0] : (args[0] && args[0].url) || "?";
      const method = ((args[1] && args[1].method) || "GET").toUpperCase();
      const internal = (window.__probeInternalCount || 0) > 0;
      const s = performance.now();
      try {
        const res = await origFetch.apply(this, args);
        pushNet({ kind: "fetch", method, url, status: res.status, ok: res.ok,
                  ms: (performance.now() - s) | 0, internal });
        return res;
      } catch (e) {
        pushNet({ kind: "fetch", method, url, status: 0, ok: false,
                  ms: (performance.now() - s) | 0, err: e && e.message || String(e), internal });
        throw e;
      }
    };
  })();
  (function hookXHR() {
    const oOpen = XMLHttpRequest.prototype.open;
    const oSend = XMLHttpRequest.prototype.send;
    XMLHttpRequest.prototype.open = function (method, url, ...rest) {
      this.__probeReq = { method: String(method || "GET").toUpperCase(), url: String(url || "") };
      return oOpen.call(this, method, url, ...rest);
    };
    XMLHttpRequest.prototype.send = function (...args) {
      const req = this.__probeReq;
      if (!req) return oSend.apply(this, args);
      const s = performance.now();
      this.addEventListener("loadend", () => {
        pushNet({ kind: "xhr", method: req.method, url: req.url,
                  status: this.status, ok: this.status >= 200 && this.status < 300,
                  ms: (performance.now() - s) | 0,
                  internal: (window.__probeInternalCount || 0) > 0 });
      });
      return oSend.apply(this, args);
    };
  })();
  return { netLog, NET_CAP };
}

/* =============================================================
   探针主逻辑
   ============================================================= */
(function probeApp() {
  "use strict";

  const out    = document.getElementById("output");
  const input  = document.getElementById("urlInput");
  const btn    = document.getElementById("btnProbe");
  const btnClr = document.getElementById("btnClear");
  const btnExp = document.getElementById("btnExport");
  const btnNet = document.getElementById("btnNetwork");
  const btnSto = document.getElementById("btnStorage");
  const modeBadge = document.getElementById("modeBadge");

  const COLOR = { info:"#0ff", ok:"#0f0", warn:"#fa0", err:"#f66", head:"#fff", dim:"#777" };
  let t0 = performance.now();
  let running = false;
  let lastResources = [];
  let lastTarget = "";
  let lastMode = "";

  const now = () => (performance.now() - t0) | 0;
  const pad = (n) => String(n).padStart(5, " ");

  function log(msg, levelOrColor) {
    try {
      const level = levelOrColor && levelOrColor.charAt(0) === "#" ? null : levelOrColor;
      const color = level ? (COLOR[level] || COLOR.info) : (levelOrColor || COLOR.info);
      const row = document.createElement("div");
      row.className = "row" + (level === "head" ? " head" : "");
      const ts = document.createElement("span");
      ts.className = "ts";
      ts.textContent = "[" + pad(now()) + "ms] ";
      const txt = document.createElement("span");
      txt.style.color = color;
      txt.textContent = msg;
      row.appendChild(ts); row.appendChild(txt);
      const nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 80;
      out.appendChild(row);
      if (nearBottom) out.scrollTop = out.scrollHeight;
    } catch (_) {}
  }
  function clearOut() { out.innerHTML = ""; t0 = performance.now(); }

  const devtools = installDevToolsLike(log, (n) => {
    btnNet.textContent = n ? ("网络·" + n) : "网络";
  });
  window.__probe = { log, box: out, clear: clearOut, netLog: devtools.netLog };

  const flash = (el) => {
    if (!el || el.disabled) return;
    el.classList.remove("is-flash");
    void el.offsetWidth;
    el.classList.add("is-flash");
    setTimeout(() => el.classList.remove("is-flash"), 380);
  };
  const bindPress = (el) => {
    if (!el) return;
    const down = () => el.classList.add("is-pressed");
    const up = () => el.classList.remove("is-pressed");
    el.addEventListener("pointerdown", down, { passive: true });
    el.addEventListener("pointerup", up, { passive: true });
    el.addEventListener("pointercancel", up, { passive: true });
    el.addEventListener("pointerleave", up, { passive: true });
    el.addEventListener("touchstart", down, { passive: true });
    el.addEventListener("touchend", up, { passive: true });
    el.addEventListener("touchcancel", up, { passive: true });
  };
  [btnNet, btnSto, btnExp, btnClr].forEach(bindPress);

  function setMode(mode) {
    lastMode = mode;
    if (mode === "B") {
      modeBadge.textContent = "B · 注入式";
      modeBadge.className = "badge b";
    } else if (mode === "A") {
      modeBadge.textContent = "A · 静态分析";
      modeBadge.className = "badge a";
    } else {
      modeBadge.textContent = "待探测";
      modeBadge.className = "badge";
    }
  }

  /* ---------- 并发池 ---------- */
  async function pool(tasks, limit) {
    const results = new Array(tasks.length);
    let next = 0;
    async function worker() {
      while (next < tasks.length) {
        const i = next++;
        try { results[i] = await tasks[i](); }
        catch (e) { results[i] = { ok:false, ms:0, err:(e && e.message) || String(e) }; }
      }
    }
    await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
    return results;
  }

  /* ---------- 单资源探测 ---------- */
  async function probeFetch(url, timeout) {
    timeout = timeout || 8000;
    const s = performance.now();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    window.__probeInternalCount = (window.__probeInternalCount || 0) + 1;
    try {
      await fetch(url, { mode: "no-cors", cache: "no-store",
                         referrerPolicy: "no-referrer", signal: ctrl.signal });
      return { ok: true, ms: (performance.now() - s) | 0 };
    } catch (e) {
      return { ok: false, ms: (performance.now() - s) | 0,
               err: e.name === "AbortError" ? "超时" : (e.message || String(e)) };
    } finally {
      window.__probeInternalCount = Math.max(0, (window.__probeInternalCount || 0) - 1);
      clearTimeout(timer);
    }
  }
  function probeImage(url, timeout) {
    timeout = timeout || 8000;
    return new Promise((resolve) => {
      const s = performance.now();
      const img = new Image();
      let done = false;
      const fin = (ok, err) => {
        if (done) return; done = true;
        img.onload = img.onerror = null;
        resolve({ ok, ms: (performance.now() - s) | 0, err });
      };
      img.onload = () => fin(true);
      img.onerror = () => fin(false, "加载失败");
      img.referrerPolicy = "no-referrer";
      setTimeout(() => fin(false, "超时"), timeout);
      img.src = url;
    });
  }

  /* ============================================================
     A 模式：静态分析
     ============================================================ */
  async function stageReach(url) {
    const s = performance.now();
    window.__probeInternalCount = (window.__probeInternalCount || 0) + 1;
    try {
      await fetch(url, { mode: "no-cors", cache: "no-store", redirect: "follow",
                         referrerPolicy: "no-referrer" });
      log("no-cors 请求完成，耗时 " + ((performance.now()-s)|0) + " ms", "ok");
      return true;
    } catch (e) {
      log("no-cors 请求失败，耗时 " + ((performance.now()-s)|0) + " ms：" + (e.message || e), "err");
      return false;
    } finally {
      window.__probeInternalCount = Math.max(0, (window.__probeInternalCount || 0) - 1);
    }
  }
  async function stageContent(url) {
    const s = performance.now();
    window.__probeInternalCount = (window.__probeInternalCount || 0) + 1;
    try {
      const r = await fetch(url, { mode: "cors", cache: "no-store", redirect: "follow",
                                   referrerPolicy: "no-referrer" });
      const ms = (performance.now() - s) | 0;
      const ct = r.headers.get("content-type") || "(未暴露)";
      log("CORS 请求成功：HTTP " + r.status + " | " + ct + " | " + ms + "ms",
          r.ok ? "ok" : "warn");
      const text = await r.text();
      log("响应体 " + text.length + " 字符", "ok");
      if (/text\/html|xhtml/i.test(ct) || /<html[\s>]/i.test(text.slice(0, 2000))) return text;
      return null;
    } catch (e) {
      log("CORS 请求失败：" + (e.message || e), "warn");
      log("目标站未放行 CORS，无法读取 HTML", "dim");
      return null;
    } finally {
      window.__probeInternalCount = Math.max(0, (window.__probeInternalCount || 0) - 1);
    }
  }
  async function extractCssUrls(cssUrl) {
    window.__probeInternalCount = (window.__probeInternalCount || 0) + 1;
    try {
      const r = await fetch(cssUrl, { mode: "cors", cache: "no-store",
                                      referrerPolicy: "no-referrer" });
      if (!r.ok) return [];
      const text = await r.text();
      const found = [];
      const re = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
      let m;
      while ((m = re.exec(text))) {
        const u = m[2].trim();
        if (/^(data:|blob:|about:|#)/i.test(u)) continue;
        try { found.push({ url: new URL(u, cssUrl).href, from: cssUrl }); } catch (_) {}
      }
      return found;
    } catch (_) { return []; }
    finally {
      window.__probeInternalCount = Math.max(0, (window.__probeInternalCount || 0) - 1);
    }
  }
  function parseSrcset(v) {
    if (!v) return [];
    return v.split(",").map(s => s.trim().split(/\s+/)[0]).filter(Boolean);
  }
  async function stageResources(baseUrl, html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const baseEl = doc.querySelector("base[href]");
    let base = baseUrl;
    if (baseEl) { try { base = new URL(baseEl.getAttribute("href"), baseUrl).href; } catch (_) {} }
    const abs = (u) => { try { return new URL(u, base).href; } catch (_) { return null; } };
    const valid = (u) => u && !/^(data:|blob:|javascript:|about:|#)/i.test(u);

    log("页面标题: " + (doc.title || "(空)"), "ok");

    const inventory = [];
    const seen = new Set();
    const add = (kind, raw) => {
      const u = abs(raw);
      if (!valid(u) || seen.has(u)) return;
      seen.add(u);
      inventory.push({ kind, url: u });
    };
    doc.querySelectorAll("script[src]").forEach(e => add("script", e.getAttribute("src")));
    doc.querySelectorAll("link[href]").forEach(e => {
      const rel = (e.getAttribute("rel") || "").toLowerCase();
      const kind = rel.includes("stylesheet") ? "style"
                 : rel.includes("icon") ? "icon"
                 : rel.includes("manifest") ? "manifest"
                 : rel.includes("preload") ? "preload"
                 : "link";
      add(kind, e.getAttribute("href"));
    });
    doc.querySelectorAll("img").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("img", s);
      parseSrcset(e.getAttribute("srcset")).forEach(u => add("img", u));
    });
    doc.querySelectorAll("source").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("media", s);
      parseSrcset(e.getAttribute("srcset")).forEach(u => add("media", u));
    });
    doc.querySelectorAll("video,audio").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("media", s);
      const p = e.getAttribute("poster"); if (p) add("img", p);
    });
    doc.querySelectorAll("iframe[src]").forEach(e => add("iframe", e.getAttribute("src")));

    log("HTML 静态资源清单: " + inventory.length + " 条", "ok");
    const cssUrls = inventory.filter(x => x.kind === "style").map(x => x.url);
    if (cssUrls.length) {
      let cssHit = 0;
      for (const cssUrl of cssUrls) {
        const found = await extractCssUrls(cssUrl);
        cssHit += found.length;
        found.forEach(f => add("asset", f.url));
      }
      log("CSS 内资源: " + cssHit + " 条", cssHit ? "ok" : "warn");
    }
    log("──── 完整地址清单（" + inventory.length + " 条）────", "head");
    inventory.forEach(x => log("  " + x.kind.padEnd(9) + " " + x.url, "dim"));

    const toProbe = inventory.filter(x => /^https?:/i.test(x.url) && x.kind !== "icon" && x.kind !== "preload");
    const LIMIT = 60;
    const list = toProbe.slice(0, LIMIT);
    if (toProbe.length > LIMIT) log("探测上限 " + LIMIT, "warn");
    if (!list.length) return { inventory, results: [] };
    log("探测 " + list.length + " 个资源（并发 6）…", "info");
    const tasks = list.map(it => () =>
      (it.kind === "img" ? probeImage(it.url) : probeFetch(it.url))
        .then(r => ({ kind: it.kind, url: it.url, ...r })));
    const results = await pool(tasks, 6);
    results.forEach(r => {
      log("[" + (r.ok ? "OK " : "ERR") + "] " + r.kind.padEnd(9) + " " + r.url +
          " (" + (r.ms|0) + "ms)" + (r.ok ? "" : " ← " + r.err), r.ok ? "ok" : "err");
    });
    return { inventory, results };
  }

  /* ============================================================
     B 模式：iframe 注入 + 运行时采集
     ============================================================ */
  function runB(target) {
    return new Promise((resolve) => {
      const id = "probe-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
      const iframe = document.createElement("iframe");
      iframe.id = id;
      // 关键：不加 sandbox，允许父页面访问 contentDocument 以注入探针
      // 若加 sandbox 需 allow-same-origin，且会弹出安全告警
      iframe.style.cssText =
        "position:fixed;left:-9999px;top:0;width:390px;height:844px;" +
        "border:0;visibility:hidden;pointer-events:none;";
      iframe.setAttribute("referrerpolicy", "no-referrer");

      const stats = {
        ready: false, injected: false,
        jsError: 0, promiseRejection: 0, resError: 0, resource: 0,
        lcp: 0, cls: 0, longtask: 0, inp: 0,
        nav: false, dom: false, storage: false
      };
      const runtimeResources = [];

      function onMessage(e) {
        if (!e.data || !e.data.__probe || e.data.id !== id) return;
        const type = e.data.type;
        const data = e.data.data;
        const t = e.data.t;
        const ts = "[" + String(t).padStart(5, " ") + "ms] ";
        switch (type) {
          case "ready":
            stats.ready = true;
            log(ts + "[INJ] 探针已注入并启动: " + data.url, "ok");
            break;
          case "js-error":
            stats.jsError++;
            log(ts + "[JS-ERR] " + data.message +
                "\n        at " + data.filename + ":" + data.lineno + ":" + data.colno +
                (data.stack ? "\n" + data.stack : ""), "#f66");
            break;
          case "promise-rejection":
            stats.promiseRejection++;
            log(ts + "[PROMISE] " + data.message +
                (data.stack ? "\n" + data.stack : ""), "#f66");
            break;
          case "res-error":
            stats.resError++;
            log(ts + "[RES-FAIL] " + data.tag + " " + data.url, "#f66");
            break;
          case "resource":
            stats.resource++;
            runtimeResources.push(data);
            log(ts + "[RES] " + data.initiatorType.padEnd(10) + " " +
                data.name + " (" + data.duration + "ms, " +
                (data.transferSize ? data.transferSize + "B" : "缓存") + ")",
                data.transferSize === 0 ? "dim" : "info");
            break;
          case "navigation":
            stats.nav = true;
            log(ts + "[NAV] DNS " + data.dns + " / TCP " + data.tcp +
                " / TLS " + data.tls + " / TTFB " + data.ttfb +
                " / DL " + data.download + "ms", "info");
            log(ts + "[NAV] domInteractive " + data.domInteractive +
                " / DCL " + data.domContentLoaded +
                " / load " + data.load + "ms", "info");
            log(ts + "[NAV] 传输 " + data.transferSize + "B / 解码 " + data.decodedBodySize + "B", "dim");
            break;
          case "lcp":
            stats.lcp = data.value;
            log(ts + "[LCP] " + data.value + "ms" + (data.element ? " (" + data.element + ")" : ""), "#0ff");
            break;
          case "cls":
            stats.cls = data.value;
            log(ts + "[CLS] " + data.value, "#0ff");
            break;
          case "longtask":
            stats.longtask++;
            log(ts + "[LONG] 长任务 " + data.duration + "ms @" + data.start, "#fa0");
            break;
          case "inp":
            stats.inp++;
            log(ts + "[INP] " + data.name + " " + data.duration + "ms", "#fa0");
            break;
          case "dom-summary":
            stats.dom = true;
            log(ts + "[DOM] " + data.title, "ok");
            log(ts + "  readyState " + data.readyState +
                " / scripts " + data.scripts +
                " / styles " + data.stylesheets +
                " / imgs " + data.images +
                " / links " + data.links +
                " / inputs " + data.inputs +
                " / body " + data.bodyWidth + "×" + data.bodyHeight, "dim");
            break;
          case "storage":
            stats.storage = true;
            log(ts + "[STORE] localStorage " + data.local.count + " 项 (" + data.local.bytes + "B)" +
                " / sessionStorage " + data.session.count + " 项 (" + data.session.bytes + "B)", "info");
            if (data.local.keys.length) log(ts + "  keys: " + data.local.keys.join(", "), "dim");
            break;
        }
      }

      window.addEventListener("message", onMessage);

      let loadFired = false;
      let injectAttempted = false;

      function tryInject() {
        if (injectAttempted) return;
        injectAttempted = true;

        let doc = null;
        try { doc = iframe.contentDocument; } catch (_) {}

        if (!doc) {
          log("[INJ] 无法访问 iframe.contentDocument", "err");
          log("原因：目标页跨域，或设了 X-Frame-Options 拒绝嵌入", "warn");
          log("降级到 A 模式（静态分析）", "warn");
          cleanup();
          resolve({ mode: "A", reason: "no-content-document" });
          return;
        }

        // 用注入的 <script> 运行采集代码
        try {
          const script = doc.createElement("script");
          script.textContent =
            "(" + injectedProbe.toString() + ")(" +
            JSON.stringify({ id: id }) + ");";
          (doc.head || doc.documentElement).appendChild(script);
          log("[INJ] 采集脚本已写入目标页", "info");
        } catch (e) {
          log("[INJ] 注入失败: " + e.message, "err");
          log("可能原因：CSP 阻止 inline script", "warn");
          log("降级到 A 模式", "warn");
          cleanup();
          resolve({ mode: "A", reason: "csp-blocked" });
          return;
        }

        // 等待 ready（最多 3s）
        let waited = 0;
        const waitTimer = setInterval(() => {
          if (stats.ready) {
            clearInterval(waitTimer);
            stats.injected = true;
          } else if ((waited += 100) > 3000) {
            clearInterval(waitTimer);
            log("[INJ] 3s 内未收到 ready，采集脚本可能被拦截", "warn");
          }
        }, 100);
      }

      iframe.addEventListener("load", () => {
        if (loadFired) return;
        loadFired = true;
        // 微延迟，等 CSP/渲染稳定
        setTimeout(tryInject, 50);
      });
      iframe.addEventListener("error", () => {
        if (injectAttempted) return;
        injectAttempted = true;
        log("[INJ] iframe 加载失败", "err");
        cleanup();
        resolve({ mode: "A", reason: "iframe-load-error" });
      });

      // 兜底：15s 还没加载完，判定失败
      const timeout = setTimeout(() => {
        if (!loadFired && !injectAttempted) {
          log("[INJ] iframe 加载超时 15s", "err");
          log("可能：目标页禁止嵌入（X-Frame-Options / CSP frame-ancestors）", "warn");
          cleanup();
          resolve({ mode: "A", reason: "timeout" });
        }
      }, 15000);

      function cleanup() {
        clearTimeout(timeout);
        window.removeEventListener("message", onMessage);
        // 采集完成后卸载 iframe，避免持续占用资源
        setTimeout(() => { try { iframe.remove(); } catch (_) {} }, 5000);
      }

      // 挂载并开始加载
      document.body.appendChild(iframe);
      iframe.src = target.href;
      log("[INJ] iframe 开始加载: " + target.href, "info");

      // 等待采集窗口（注入后 4 秒）
      const startWait = Date.now();
      const pollTimer = setInterval(() => {
        const elapsed = Date.now() - startWait;
        if (stats.injected && elapsed > 4000) {
          clearInterval(pollTimer);
          finishB();
        } else if (elapsed > 12000) {
          clearInterval(pollTimer);
          log("[INJ] 采集窗口超时，强制结束", "warn");
          finishB();
        }
      }, 200);

      function finishB() {
        log("════════ B 模式采集汇总 ════════", "head");
        log("JS 错误: " + stats.jsError +
            " / Promise 拒绝: " + stats.promiseRejection +
            " / 资源失败: " + stats.resError,
            stats.jsError || stats.promiseRejection || stats.resError ? "err" : "ok");
        log("运行时请求: " + stats.resource + " 条", "info");
        log("Navigation Timing: " + (stats.nav ? "已获取" : "未获取"), stats.nav ? "ok" : "warn");
        log("LCP: " + stats.lcp + "ms / CLS: " + stats.cls +
            " / 长任务: " + stats.longtask + " / INP事件: " + stats.inp, "info");
        log("DOM 摘要: " + (stats.dom ? "已获取" : "未获取") +
            " / 存储: " + (stats.storage ? "已获取" : "未获取"), "info");

        // 缓存运行时资源供导出
        lastResources = runtimeResources.map(r => ({
          kind: r.initiatorType || "resource",
          url: r.name,
          ms: r.duration,
          bytes: r.transferSize
        }));
        btnExp.disabled = !lastResources.length;

        cleanup();
        resolve({ mode: "B", stats });
      }
    });
  }

  /* ============================================================
     主流程：自动判断 A / B
     ============================================================ */
  async function run(raw) {
    if (running) return;
    running = true;
    btn.disabled = true;
    btn.textContent = "探测中…";
    out.innerHTML = "";
    t0 = performance.now();
    lastResources = [];
    lastTarget = "";
    btnExp.disabled = true;

    try {
      let v = (raw || "").trim();
      if (!v) { log("请输入网址", "err"); return; }
      // 支持相对路径：以当前页为基准
      let target;
      try { target = new URL(v, location.href); }
      catch (_) { log("URL 格式非法: " + raw, "err"); return; }
      if (!/^https?:$/.test(target.protocol)) {
        log("仅支持 http/https，当前协议: " + target.protocol, "err");
        return;
      }

      const sameOrigin = target.origin === location.origin;

      log("探测目标: " + target.href, "head");
      log("探针页源: " + location.origin, "dim");
      log("目标页源: " + target.origin + (sameOrigin ? " ✓ 同源" : " ✗ 跨域"),
          sameOrigin ? "ok" : "warn");
      log("探针环境: " + navigator.userAgent, "dim");

      if (sameOrigin) {
        setMode("B");
        log("──── 尝试 B 模式（注入式全站采集） ────", "head");
        const result = await runB(target);
        if (result.mode === "B") {
          log("════════ 探测结束（B 模式）════════", "head");
          log("总耗时: " + now() + " ms", "ok");
          lastTarget = target.href;
          return;
        }
        log("B 模式失败（" + result.reason + "），自动降级 A 模式", "warn");
        setMode("A");
      } else {
        setMode("A");
        log("──── 跨域目标，走 A 模式（静态分析）────", "head");
      }

      // ============ A 模式 ============
      log("──── 阶段 1 / 3：网络可达性 ────", "head");
      const reachable = await stageReach(target.href);

      log("──── 阶段 2 / 3：内容抓取 ────", "head");
      const html = await stageContent(target.href);

      let inventory = [], results = [];
      if (html) {
        log("──── 阶段 3 / 3：资源清单 + 探测 ────", "head");
        const r = await stageResources(target.href, html);
        inventory = r.inventory;
        results = r.results;
        lastResources = inventory;
        lastTarget = target.href;
        btnExp.disabled = !inventory.length;
      } else {
        log("──── 阶段 3 / 3：已跳过（无 HTML）────", "head");
      }

      log("════════ 探测结束（A 模式）════════", "head");
      log("总耗时: " + now() + " ms", "ok");
      log("网络可达: " + (reachable ? "通" : "不通"), reachable ? "ok" : "err");
      log("HTML: " + (html ? html.length + " 字符" : "未获取"), html ? "ok" : "warn");
      log("资源清单: " + inventory.length + " 条", inventory.length ? "ok" : "warn");
    } catch (e) {
      log("探针内部异常: " + ((e && e.message) || e), "err");
      if (e && e.stack) console.error(e);
    } finally {
      running = false;
      btn.disabled = false;
      btn.textContent = "开始探测";
    }
  }

  /* ---------- 网络缓冲区 / 存储 ---------- */
  function printNetwork() {
    const list = devtools.netLog;
    log("──── 父页面网络缓冲区（" + list.length + " 条）────", "head");
    if (!list.length) { log("暂无记录（B 模式的运行时请求已实时显示在上面）", "dim"); return; }
    list.forEach((r, i) => {
      log("#" + String(i + 1).padStart(3, " ") + " " +
          r.kind.padEnd(5) + " " + r.method.padEnd(4) +
          " " + (r.status || (r.err ? "ERR" : "-")) + " " +
          r.url + " (" + r.ms + "ms)" +
          (r.err ? " ← " + r.err : ""), r.ok ? "dim" : "err");
    });
  }
  function printStorage() {
    log("──── 父页面存储摘要 ────", "head");
    [["localStorage", localStorage], ["sessionStorage", sessionStorage]].forEach(([name, store]) => {
      let total = 0;
      try { total = store.length; } catch (_) { log(name + ": 不可访问", "err"); return; }
      let bytes = 0;
      const items = [];
      for (let i = 0; i < total; i++) {
        try {
          const k = store.key(i);
          const v = store.getItem(k) || "";
          bytes += k.length + v.length;
          items.push({ k, b: k.length + v.length });
        } catch (_) {}
      }
      log(name + ": " + total + " 项，约 " + (bytes / 1024).toFixed(1) + " KB", "info");
      items.slice(0, 20).forEach(it => log("  · " + it.k + " (" + it.b + "B)", "dim"));
      if (items.length > 20) log("  · …剩余 " + (items.length - 20) + " 项省略", "dim");
    });
  }

  /* ---------- 事件 ---------- */
  btn.addEventListener("click", () => run(input.value));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); run(input.value); }
  });
  btnClr.addEventListener("click", () => {
    clearOut();
    devtools.netLog.length = 0;
    btnNet.textContent = "网络";
    setMode("");
    flash(btnClr);
  });
  btnNet.addEventListener("click", () => { printNetwork(); out.scrollTop = out.scrollHeight; flash(btnNet); });
  btnSto.addEventListener("click", () => { printStorage(); out.scrollTop = out.scrollHeight; flash(btnSto); });
  btnExp.addEventListener("click", () => {
    if (!lastResources.length) return;
    const payload = {
      target: lastTarget, mode: lastMode,
      probedAt: new Date().toISOString(),
      total: lastResources.length,
      resources: lastResources
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "probe-" + lastMode + "-" +
                 (new URL(lastTarget).hostname || "site") + "-" + Date.now() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    log("已导出 " + lastResources.length + " 条 → " + a.download, "ok");
    out.scrollTop = out.scrollHeight;
    flash(btnExp);
  });

  t0 = performance.now();
  log("网站探针已就绪 · B 模式（注入式）· " + new Date().toLocaleString(), "head");
  log("同源目标 → 自动 B 模式（L1~L10 全量）；跨域 → 自动 A 模式（L1~L6）", "dim");
  log("提示：B 模式要求目标页与当前探针页同源，且未设 X-Frame-Options", "info");
  log("输入同源网址（如 /index.html 或 https://同域/path）后点击「开始探测」", "info");
})();
</script>
