<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- [iOS-A] viewport 全套 + interactive-widget 让键盘弹起时 layout viewport 同步缩小 -->
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, minimum-scale=1.0,
               user-scalable=no, viewport-fit=cover,
               interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>网站探针 · Web Probe</title>
<style>
  /* ============ [iOS-B] 根布局锁定 ============ */
  :root { --app-h: 100dvh; --app-top: 0px; }

  * {
    box-sizing: border-box;
    margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    width: 100%;
    height: 100%;
    height: -webkit-fill-available;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    position: fixed;
    top: 0; left: 0; right: 0;
    width: 100%;
    height: var(--app-h, 100dvh);
    transform: translateY(var(--app-top, 0px));
    overflow: hidden;
    display: flex; flex-direction: column;
    background: #0a0a0a; color: #0f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.55;
    touch-action: manipulation;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ============ 上段：探针输出区 ============ */
  #panel {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    border-bottom: 1px solid #222;
  }

  #toolbar {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    background: #111; border-bottom: 1px solid #1e1e1e;
    font-size: 12px; color: #888;
  }
  #toolbar .title { flex: 1; color: #0f0; font-weight: bold; }
  #toolbar button {
    padding: 6px 12px;
    border: 1px solid #333; border-radius: 8px;
    background: #000; color: #999;
    font: inherit; font-size: 12px; cursor: pointer;
    touch-action: manipulation;
  }
  #toolbar button:active { background: #1a1a1a; }
  #toolbar button:disabled { opacity: .4; }

  #output {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    white-space: pre-wrap; word-break: break-all;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
    -webkit-user-select: text; user-select: text;
  }
  #output .row { display: block; padding: 1px 0; }
  #output .ts { color: #555; }
  #output .head { font-weight: bold; }

  /* ============ 下段：输入区 ============ */
  #footer {
    flex: none;
    display: flex; gap: 8px; align-items: stretch;
    padding: 10px 12px;
    padding-left: calc(12px + env(safe-area-inset-left));
    padding-right: calc(12px + env(safe-area-inset-right));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #111; border-top: 1px solid #222;
  }

  #urlInput {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    background: #000; color: #0f0;
    border: 1px solid #2a2a2a; border-radius: 10px;
    font: inherit;
    /* ★ iOS 硬性阈值：≥16px 否则聚焦自动放大页面 */
    font-size: 16px;
    outline: none;
    touch-action: manipulation;
    -webkit-user-select: text; user-select: text;
    -webkit-appearance: none; appearance: none;
  }
  #urlInput:focus {
    border-color: #0a0;
    box-shadow: 0 0 0 2px rgba(0,170,0,.15);
  }
  #urlInput::placeholder { color: #444; }

  #btnProbe {
    flex: none; padding: 12px 18px;
    border: 0; border-radius: 10px;
    background: #0a0; color: #fff;
    font: inherit; font-size: 15px; font-weight: bold;
    cursor: pointer; min-width: 96px;
    touch-action: manipulation;
    transition: background .15s;
  }
  #btnProbe:active { background: #080; }
  #btnProbe:disabled { background: #263; color: #888; cursor: not-allowed; }
</style>
</head>
<body>

<section id="panel">
  <div id="toolbar">
    <span class="title">● 探针输出</span>
    <button id="btnExport" type="button" disabled>导出</button>
    <button id="btnClear" type="button">清空</button>
  </div>
  <div id="output" role="log" aria-live="polite"></div>
</section>

<footer id="footer">
  <input id="urlInput" type="text"
         inputmode="url" autocomplete="off"
         autocorrect="off" autocapitalize="off" spellcheck="false"
         enterkeyhint="go"
         placeholder="输入网址，如 example.com">
  <button id="btnProbe" type="button">开始探测</button>
</footer>

<script>
/* =============================================================
   [iOS-C] 视口锁定 + 防缩放 + 键盘紧贴
   ============================================================= */
(function lockViewportAndZoom() {
  const root = document.documentElement;

  let rafId = 0;
  function syncHeight() {
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(() => {
      const vv = window.visualViewport;
      if (!vv) {
        root.style.setProperty("--app-h", window.innerHeight + "px");
        root.style.setProperty("--app-top", "0px");
        return;
      }
      // 判定模式：interactive-widget 生效时 innerHeight 随键盘缩小且 offsetTop=0
      const diff = Math.abs(window.innerHeight - vv.height - vv.offsetTop);
      if (diff < 2) {
        root.style.setProperty("--app-h", "100dvh");
        root.style.setProperty("--app-top", "0px");
      } else {
        root.style.setProperty("--app-h", vv.height + "px");
        root.style.setProperty("--app-top", vv.offsetTop + "px");
      }
    });
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncHeight);
    window.visualViewport.addEventListener("scroll", syncHeight);
  }
  window.addEventListener("resize", syncHeight);
  window.addEventListener("orientationchange", () => {
    setTimeout(syncHeight, 200);
  });

  // 键盘动画期间多时间点采样，确保读到稳定值
  document.addEventListener("focusin", (e) => {
    if (e.target && e.target.tagName === "INPUT") {
      syncHeight();
      setTimeout(syncHeight, 100);
      setTimeout(syncHeight, 250);
      setTimeout(syncHeight, 400);
    }
  }, true);
  document.addEventListener("focusout", (e) => {
    if (e.target && e.target.tagName === "INPUT") {
      syncHeight();
      setTimeout(syncHeight, 100);
      setTimeout(syncHeight, 250);
    }
  }, true);

  syncHeight();

  // 禁止双指缩放
  ["gesturestart", "gesturechange", "gestureend"].forEach((evt) => {
    document.addEventListener(evt, (e) => e.preventDefault(), { passive: false });
  });

  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  document.addEventListener("wheel", (e) => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  // 双击兜底
  let lastEnd = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - lastEnd <= 300) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
})();

/* =============================================================
   探针主逻辑
   ============================================================= */
(function probeApp() {
  "use strict";

  const out    = document.getElementById("output");
  const input  = document.getElementById("urlInput");
  const btn    = document.getElementById("btnProbe");
  const btnClr = document.getElementById("btnClear");
  const btnExp = document.getElementById("btnExport");

  const COLOR = { info:"#0ff", ok:"#0f0", warn:"#fa0", err:"#f66", head:"#fff", dim:"#777" };
  let t0 = performance.now();
  let running = false;
  let lastResources = [];
  let lastTarget = "";

  const now = () => (performance.now() - t0) | 0;
  const pad = (n) => String(n).padStart(5, " ");

  function log(msg, level) {
    level = level || "info";
    const row = document.createElement("div");
    row.className = "row" + (level === "head" ? " head" : "");
    const ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = "[" + pad(now()) + "ms] ";
    const txt = document.createElement("span");
    txt.style.color = COLOR[level] || COLOR.info;
    txt.textContent = msg;
    row.appendChild(ts); row.appendChild(txt);
    const nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 80;
    out.appendChild(row);
    if (nearBottom) out.scrollTop = out.scrollHeight;
  }

  function clearOut() { out.innerHTML = ""; t0 = performance.now(); }

  /* ---------- 并发池 ---------- */
  async function pool(tasks, limit) {
    const results = new Array(tasks.length);
    let next = 0;
    async function worker() {
      while (next < tasks.length) {
        const i = next++;
        try { results[i] = await tasks[i](); }
        catch (e) { results[i] = { ok:false, ms:0, err:(e && e.message) || String(e) }; }
      }
    }
    await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
    return results;
  }

  /* ---------- 单资源探测 ---------- */
  async function probeFetch(url, timeout) {
    timeout = timeout || 8000;
    const s = performance.now();
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      await fetch(url, {
        mode: "no-cors", cache: "no-store",
        referrerPolicy: "no-referrer", signal: ctrl.signal
      });
      return { ok: true, ms: (performance.now() - s) | 0 };
    } catch (e) {
      return {
        ok: false, ms: (performance.now() - s) | 0,
        err: e.name === "AbortError" ? "超时" : (e.message || String(e))
      };
    } finally { clearTimeout(timer); }
  }

  function probeImage(url, timeout) {
    timeout = timeout || 8000;
    return new Promise((resolve) => {
      const s = performance.now();
      const img = new Image();
      let done = false;
      const fin = (ok, err) => {
        if (done) return; done = true;
        img.onload = img.onerror = null;
        resolve({ ok, ms: (performance.now() - s) | 0, err });
      };
      img.onload  = () => fin(true);
      img.onerror = () => fin(false, "加载失败");
      img.referrerPolicy = "no-referrer";
      setTimeout(() => fin(false, "超时"), timeout);
      img.src = url;
    });
  }

  /* ---------- 阶段 1：可达性 ---------- */
  async function stageReach(url) {
    const s = performance.now();
    try {
      await fetch(url, {
        mode: "no-cors", cache: "no-store", redirect: "follow",
        referrerPolicy: "no-referrer"
      });
      log("no-cors 请求完成（opaque），耗时 " + ((performance.now()-s)|0) + " ms", "ok");
      log("说明：opaque 响应读不到状态码，仅证明网络层可达", "dim");
      return true;
    } catch (e) {
      log("no-cors 请求失败，耗时 " + ((performance.now()-s)|0) + " ms：" + (e.message || e), "err");
      log("可能原因：DNS 失败 / 网络中断 / 服务端拒绝 / 策略拦截", "warn");
      return false;
    }
  }

  /* ---------- 阶段 2：内容抓取 ---------- */
  async function stageContent(url) {
    const s = performance.now();
    try {
      const r = await fetch(url, {
        mode: "cors", cache: "no-store", redirect: "follow",
        referrerPolicy: "no-referrer"
      });
      const ms = (performance.now() - s) | 0;
      const ct = r.headers.get("content-type") || "(未暴露)";
      log("CORS 请求成功：HTTP " + r.status + " " + (r.statusText || ""), r.ok ? "ok" : "warn");
      log("Content-Type: " + ct + " | 耗时 " + ms + " ms", "info");
      if (r.url && r.url !== url) log("最终 URL（含重定向）: " + r.url, "info");
      const text = await r.text();
      log("响应体长度: " + text.length + " 字符", "ok");
      if (/text\/html|xhtml/i.test(ct) || /<html[\s>]/i.test(text.slice(0, 2000))) {
        log("判定为 HTML 文档，进入解析阶段", "ok");
        return text;
      }
      log("响应体非 HTML，跳过 DOM 解析", "warn");
      return null;
    } catch (e) {
      const ms = (performance.now() - s) | 0;
      log("CORS 请求失败（" + ms + " ms）：" + (e.message || e), "warn");
      log("这是同源策略的正常限制：目标站未开启 Access-Control-Allow-Origin", "dim");
      log("结果：无法读取 HTML 源码，资源清单无法枚举", "dim");
      return null;
    }
  }

  /* ---------- CSS 内 url() 提取 ---------- */
  async function extractCssUrls(cssUrl) {
    try {
      const r = await fetch(cssUrl, {
        mode: "cors", cache: "no-store", referrerPolicy: "no-referrer"
      });
      if (!r.ok) return [];
      const text = await r.text();
      const found = [];
      const re = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
      let m;
      while ((m = re.exec(text))) {
        const u = m[2].trim();
        if (/^(data:|blob:|about:|#)/i.test(u)) continue;
        try { found.push({ url: new URL(u, cssUrl).href, from: cssUrl }); } catch (_) {}
      }
      return found;
    } catch (_) { return []; }
  }

  function parseSrcset(v) {
    if (!v) return [];
    return v.split(",").map(s => s.trim().split(/\s+/)[0]).filter(Boolean);
  }

  /* ---------- 阶段 3：清单 + 探测 ---------- */
  async function stageResources(baseUrl, html) {
    const doc = new DOMParser().parseFromString(html, "text/html");

    const baseEl = doc.querySelector("base[href]");
    let base = baseUrl;
    if (baseEl) {
      try { base = new URL(baseEl.getAttribute("href"), baseUrl).href; } catch (_) {}
      log("发现 <base href>: " + base, "info");
    }
    const abs   = (u) => { try { return new URL(u, base).href; } catch (_) { return null; } };
    const valid = (u) => u && !/^(data:|blob:|javascript:|about:|#)/i.test(u);

    const title = (doc.title || "").trim();
    const lang  = doc.documentElement.getAttribute("lang") || "";
    const cs    = doc.querySelector("meta[charset]");
    const vp    = doc.querySelector('meta[name="viewport"]');
    const desc  = doc.querySelector('meta[name="description"]');

    log("页面标题: " + (title || "(空)"), "ok");
    if (lang) log("lang: " + lang, "info"); else log("缺少 lang 属性", "warn");
    if (cs)   log("charset: " + cs.getAttribute("charset"), "info");
    if (vp)   log("viewport: " + vp.getAttribute("content"), "info");
    else      log("缺少 viewport meta，移动端可能缩放异常", "warn");
    if (desc) log("description: " + desc.getAttribute("content").slice(0, 120), "info");

    const inventory = [];
    const seen = new Set();
    const add = (kind, raw) => {
      const u = abs(raw);
      if (!valid(u) || seen.has(u)) return;
      seen.add(u);
      inventory.push({ kind, url: u });
    };

    doc.querySelectorAll("script[src]").forEach(e => add("script", e.getAttribute("src")));
    doc.querySelectorAll("link[href]").forEach(e => {
      const rel = (e.getAttribute("rel") || "").toLowerCase();
      const kind = rel.includes("stylesheet") ? "style"
                 : rel.includes("icon")        ? "icon"
                 : rel.includes("manifest")    ? "manifest"
                 : rel.includes("preload")     ? "preload"
                 : "link";
      add(kind, e.getAttribute("href"));
    });
    doc.querySelectorAll("img").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("img", s);
      parseSrcset(e.getAttribute("srcset")).forEach(u => add("img", u));
    });
    doc.querySelectorAll("source").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("media", s);
      parseSrcset(e.getAttribute("srcset")).forEach(u => add("media", u));
    });
    doc.querySelectorAll("video,audio").forEach(e => {
      const s = e.getAttribute("src"); if (s) add("media", s);
      const p = e.getAttribute("poster"); if (p) add("img", p);
    });
    doc.querySelectorAll("iframe[src]").forEach(e => add("iframe", e.getAttribute("src")));

    log("HTML 静态资源清单: " + inventory.length + " 条（去重后）", "ok");

    const cssUrls = inventory.filter(x => x.kind === "style").map(x => x.url);
    if (cssUrls.length) {
      log("尝试解析 " + cssUrls.length + " 个 CSS 内的 url()（受 CORS 限制）…", "info");
      let cssHit = 0;
      for (const cssUrl of cssUrls) {
        const found = await extractCssUrls(cssUrl);
        if (!found.length) continue;
        cssHit += found.length;
        found.forEach(f => add("asset", f.url));
      }
      log("CSS 内资源: " + cssHit + " 条" + (cssHit ? "" : "（可能全部被 CORS 拦截）"),
          cssHit ? "ok" : "warn");
    }

    log("──── 完整地址清单（共 " + inventory.length + " 条）────", "head");
    inventory.forEach(x => log("  " + x.kind.padEnd(9) + " " + x.url, "dim"));

    const toProbe = inventory.filter(x =>
      /^https?:/i.test(x.url) && x.kind !== "icon" && x.kind !== "preload"
    );
    const LIMIT = 60;
    const list = toProbe.slice(0, LIMIT);
    if (toProbe.length > LIMIT)
      log("探测上限 " + LIMIT + "，剩余 " + (toProbe.length - LIMIT) + " 个仅列清单不探测", "warn");
    if (!list.length) { log("无可探测资源", "info"); return { inventory, results: [] }; }

    log("开始探测 " + list.length + " 个资源（并发 6，超时 8s）…", "info");
    const tasks = list.map(it => () =>
      (it.kind === "img" ? probeImage(it.url) : probeFetch(it.url))
        .then(r => ({ kind: it.kind, url: it.url, ...r }))
    );
    const results = await pool(tasks, 6);
    results.forEach(r => {
      log("[" + (r.ok ? "OK " : "ERR") + "] " + r.kind.padEnd(9) + " " + r.url +
          "  (" + (r.ms|0) + "ms)" + (r.ok ? "" : "  ← " + r.err),
          r.ok ? "ok" : "err");
    });

    return { inventory, results };
  }

  /* ---------- 阶段 4：iframe 渲染探测 ---------- */
  function stageIframe(url) {
    return new Promise((resolve) => {
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-scripts allow-forms allow-popups");
      iframe.setAttribute("referrerpolicy", "no-referrer");
      iframe.style.cssText =
        "position:absolute;left:-9999px;top:0;width:375px;height:667px;border:0;visibility:hidden;";
      let done = false;
      const s = performance.now();
      const timer = setTimeout(() => fin(false, "超时 15s"), 15000);
      function fin(ok, note) {
        if (done) return; done = true; clearTimeout(timer);
        const ms = (performance.now() - s) | 0;
        if (ok) {
          log("[IFRAME] 加载完成，耗时 " + ms + " ms", "ok");
          log("注意：load 事件不代表真实渲染成功。X-Frame-Options / CSP frame-ancestors 拒绝时仍会触发 load", "dim");
        } else {
          log("[IFRAME] 加载失败，耗时 " + ms + " ms：" + note, "err");
        }
        iframe.remove();
        resolve(ok);
      }
      iframe.onload  = () => fin(true);
      iframe.onerror = () => fin(false, "onerror 触发");
      document.body.appendChild(iframe);
      iframe.src = url;
    });
  }

  /* ---------- 主流程 ---------- */
  async function run(raw) {
    if (running) return;
    running = true;
    btn.disabled = true;
    btn.textContent = "探测中…";
    out.innerHTML = "";
    t0 = performance.now();
    lastResources = [];
    lastTarget = "";
    btnExp.disabled = true;

    try {
      let v = (raw || "").trim();
      if (!v) { log("请输入网址", "err"); return; }
      if (!/^[a-z][a-z0-9+.\-]*:\/\//i.test(v)) v = "https://" + v;

      let target;
      try { target = new URL(v); }
      catch (_) { log("URL 格式非法: " + raw, "err"); return; }

      if (!/^https?:$/.test(target.protocol)) {
        log("仅支持 http/https，当前协议: " + target.protocol, "err");
        return;
      }

      log("探测目标: " + target.href, "head");
      log("探针环境: " + navigator.userAgent, "dim");
      log("视口: " + window.innerWidth + "×" + window.innerHeight +
          " · DPR " + (window.devicePixelRatio || 1), "dim");

      log("──── 阶段 1 / 4：网络可达性 ────", "head");
      const reachable = await stageReach(target.href);

      log("──── 阶段 2 / 4：内容抓取与解析 ────", "head");
      const html = await stageContent(target.href);

      let inventory = [], results = [];
      if (html) {
        log("──── 阶段 3 / 4：资源清单 + 探测 ────", "head");
        const r = await stageResources(target.href, html);
        inventory = r.inventory;
        results   = r.results;
        lastResources = inventory;
        lastTarget = target.href;
        btnExp.disabled = !inventory.length;
      } else {
        log("──── 阶段 3 / 4：资源探测（已跳过） ────", "head");
        log("未获取 HTML 源码，无法枚举资源", "warn");
      }

      log("──── 阶段 4 / 4：页面渲染（iframe） ────", "head");
      await stageIframe(target.href);

      log("════════ 探测结束 ════════", "head");
      log("总耗时: " + now() + " ms", "ok");
      log("网络可达性: " + (reachable ? "通" : "不通"), reachable ? "ok" : "err");
      log("HTML 源码: " + (html ? "已获取（" + html.length + " 字符）" : "未获取（CORS 限制）"),
          html ? "ok" : "warn");
      log("资源清单: " + inventory.length + " 条完整地址", inventory.length ? "ok" : "warn");
      if (results.length) {
        const okN = results.filter(r => r.ok).length;
        log("可达性探测: 共 " + results.length + "，可达 " + okN +
            "，失败 " + (results.length - okN),
            okN === results.length ? "ok" : "warn");
      }
    } catch (e) {
      log("探针内部异常: " + ((e && e.message) || e), "err");
      if (e && e.stack) console.error(e);
    } finally {
      running = false;
      btn.disabled = false;
      btn.textContent = "开始探测";
    }
  }

  /* ---------- 事件 ---------- */
  btn.addEventListener("click", () => run(input.value));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); input.blur(); run(input.value); }
  });
  btnClr.addEventListener("click", clearOut);

  btnExp.addEventListener("click", () => {
    if (!lastResources.length) return;
    const payload = {
      target: lastTarget,
      probedAt: new Date().toISOString(),
      total: lastResources.length,
      resources: lastResources
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)],
                          { type: "application/json;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "probe-" + (new URL(lastTarget).hostname) + "-" +
                 Date.now() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    log("已导出 " + lastResources.length + " 条完整地址 → " + a.download, "ok");
  });

  /* ---------- 启动自检 ---------- */
  t0 = performance.now();
  log("网站探针已就绪 · " + new Date().toLocaleString(), "head");
  log("视口 " + window.innerWidth + "×" + window.innerHeight +
      " · DPR " + (window.devicePixelRatio || 1) +
      " · 语言 " + navigator.language, "dim");
  if (navigator.connection && navigator.connection.effectiveType)
    log("网络类型: " + navigator.connection.effectiveType, "dim");
  log("输入网址后点击「开始探测」", "info");
})();
</script>
</body>
</html>
