<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt创意脚本编辑</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button
      class="hamburger-btn"
      id="hamburgerBtn"
      aria-label="打开菜单"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      ☰
    </button>

    <nav class="sidebar" id="sidebar" aria-label="主导航">
      <!-- 搜索框 -->
      <div class="sidebar-search">
        <input
          type="search"
          id="sidebarSearch"
          placeholder="🔍搜索脚本..."
          autocomplete="off"
          aria-label="搜索脚本"
        />
      </div>

      <div class="nav-item" data-path="#/" role="button" tabindex="0">
        🏠 首页
      </div>
      <div class="nav-item" data-path="#/about" role="button" tabindex="0">
        📖 关于
      </div>
      <div class="nav-item" data-path="#/ai" role="button" tabindex="0">
        🤖 AI助手
      </div>
      <div class="nav-item" data-path="#/generator" role="button" tabindex="0">
        ✏️ 编写脚本
      </div>
      <div class="divider"></div>
      <div class="section-title">📄 我的脚本</div>
      <div id="sidebar-pages">
        <div class="no-pages">暂无生成的脚本</div>
      </div>

      <!-- 底部 -->
      <div class="sidebar-footer">
        <div class="footer-row">
          <div
            class="nav-item footer-item"
            id="exportZipSidebar"
            role="button"
            tabindex="0"
          >
            📦 导出ZIP
          </div>
          <div class="footer-vdivider"></div>
          <div
            class="nav-item footer-item"
            id="themeToggleSidebar"
            role="button"
            tabindex="0"
          >
            🌓 切换主题
          </div>
        </div>
      </div>
    </nav>
    <div class="overlay" id="overlay"></div>

    <main id="app">加载中…</main>

    <div
      class="modal-backdrop"
      id="modalBackdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" id="modalBox"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <script src="js/script.js"></script>
  </body>
</html>
