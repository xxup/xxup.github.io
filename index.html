<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt创意脚本编辑</title>

    <link rel="prefetch" href="p5/dots.js" />
    <link rel="prefetch" href="p5/orbit.js" />
    <link rel="prefetch" href="p5/rotating-square.js" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button class="hamburger-btn" id="hamburgerBtn">☰</button>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input type="text" id="searchInput" placeholder="🔍 搜索脚本..." />
      </div>

      <div class="nav-item" data-path="/" data-i18n="nav.home">🏠 首页</div>
      <div class="nav-item" data-path="/about" data-i18n="nav.about">
        📖 关于
      </div>
      <div class="nav-item" data-path="/ai" data-i18n="nav.ai">🤖 AI助手</div>
      <div class="nav-item" data-path="/generator" data-i18n="nav.generator">
        ✏️ 编写脚本
      </div>

      <div class="section-title" data-i18n="nav.myScripts">📄 我的脚本</div>
      <div id="sidebar-pages">
        <div class="no-pages" data-i18n="messages.noPages">暂无编写的脚本</div>
      </div>

      <div class="sidebar-footer">
        <div
          class="nav-item"
          id="themeToggleSidebar"
          data-i18n="nav.themeToggle"
        >
          🌓 切换主题
        </div>
      </div>
    </div>
    <div class="overlay" id="overlay"></div>

    <div id="app">加载中...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
