<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js 脚本生成器 · 纯静态版</title>
  <!-- CodeMirror 外部依赖 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <style>
    /* ---------- 全局重置 ---------- */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    /* ---------- 导航栏 ---------- */
    nav {
      background: #333;
      padding: 10px 20px;
      border-radius: 5px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    nav .nav-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }
    nav .nav-right {
      position: relative;
    }
    nav a,
    .dropdown-btn {
      color: white;
      text-decoration: none;
      margin-right: 15px;
      cursor: pointer;
      background: none;
      border: none;
      font-size: 1rem;
      padding: 5px 10px;
    }
    nav a:hover,
    .dropdown-btn:hover {
      background: #555;
      border-radius: 3px;
    }

    /* ---------- 下拉菜单 ---------- */
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: #f9f9f9;
      min-width: 220px;
      box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
      z-index: 1;
      border-radius: 4px;
      padding: 5px 0;
    }
    .dropdown-content .page-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid #eee;
      background: white;
    }
    .dropdown-content .page-item:last-child {
      border-bottom: none;
    }
    .dropdown-content .page-item a {
      color: #333;
      text-decoration: none;
      flex: 1;
      cursor: pointer;
    }
    .dropdown-content .page-item a:hover {
      background: transparent;
    }
    .dropdown-content .page-item .actions {
      display: flex;
      gap: 5px;
    }
    .dropdown-content .page-item .actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .dropdown-content .page-item .actions .del {
      color: #d9534f;
    }
    .dropdown-content .page-item .actions .del:hover {
      background: #f2dede;
    }
    .dropdown-content .page-item .actions .rename {
      color: #5bc0de;
    }
    .dropdown-content .page-item .actions .rename:hover {
      background: #d9edf7;
    }
    .dropdown:hover .dropdown-content {
      display: block;
    }
    .dropdown-btn {
      background: #444;
      border-radius: 3px;
    }

    /* ---------- 主内容 ---------- */
    #app {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 5px;
      min-height: 200px;
    }

    /* ---------- 表单元素 ---------- */
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
    }
    .form-group .CodeMirror {
      border: 1px solid #ccc;
      border-radius: 4px;
      height: 300px;
      font-size: 14px;
    }

    /* ---------- 按钮 ---------- */
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }

    /* ---------- 结果与预览 ---------- */
    .result {
      margin-top: 20px;
      padding: 10px;
      background: #e9f7fe;
      border-radius: 4px;
    }
    .preview-img {
      max-width: 200px;
      max-height: 200px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .no-pages {
      color: #999;
      font-style: italic;
      padding: 8px 16px;
      background: white;
      display: block;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .action-buttons button {
      background: #6c757d;
    }
    .action-buttons button.preview {
      background: #28a745;
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav>
    <div class="nav-left">
      <a href="/">首页</a>
      <a href="/about">关于</a>
      <a href="/generator">生成 p5.js 脚本</a>
    </div>
    <div class="nav-right">
      <div class="dropdown">
        <button class="dropdown-btn">📄 我的脚本 ▾</button>
        <div class="dropdown-content" id="page-dropdown">
          <span class="no-pages">暂无生成的脚本</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主内容区域 -->
  <div id="app">加载中...</div>

  <!-- CodeMirror JS 依赖 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <!-- 主脚本 -->
  <script>
    // -------- 本地存储管理 --------
    function getPages() {
      try {
        return JSON.parse(localStorage.getItem('p5_pages')) || [];
      } catch {
        return [];
      }
    }
    function savePages(pages) {
      localStorage.setItem('p5_pages', JSON.stringify(pages));
    }

    // -------- 工具函数 --------
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 生成 p5 页面 HTML（图片用 DataURL 嵌入）
    function generatePageHtml(title, script, imageDataUrl) {
      const safeTitle = escapeHtml(title) || '未命名页面';
      const imgVar = imageDataUrl ? `var imageUrl = "${imageDataUrl}";` : 'var imageUrl = null;';
      return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${safeTitle}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"><\/script>
</head>
<body>
  <script>
    ${imgVar}
    ${script}
  <\/script>
</body>
</html>`;
    }

    // 预览（新窗口打开）
    function previewPage(htmlContent) {
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(htmlContent);
        win.document.close();
      } else {
        alert('请允许弹出窗口，以便预览生成的页面。');
      }
    }

    // 下载 HTML 文件
    function downloadPage(htmlContent, filename) {
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename || 'p5_sketch.html';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // -------- 更新导航下拉菜单 --------
    function updateNavPages() {
      const pages = getPages();
      const container = document.getElementById('page-dropdown');
      if (!pages.length) {
        container.innerHTML = '<span class="no-pages">暂无生成的脚本</span>';
        return;
      }
      let html = '';
      pages.forEach((page, index) => {
        const title = escapeHtml(page.title);
        html += `
          <div class="page-item">
            <a onclick="previewPageByIndex(${index})">${title}</a>
            <div class="actions">
              <button class="rename" onclick="renamePage(${index})" title="重命名">✏️</button>
              <button class="del" onclick="deletePage(${index})" title="删除">🗑️</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 预览（通过索引）
    window.previewPageByIndex = function(index) {
      const pages = getPages();
      if (pages[index]) {
        previewPage(pages[index].html);
      }
    };

    // 删除页面
    window.deletePage = function(index) {
      if (!confirm('确定要删除该页面吗？此操作不可恢复！')) return;
      const pages = getPages();
      pages.splice(index, 1);
      savePages(pages);
      updateNavPages();
      render();
    };

    // 重命名页面
    window.renamePage = function(index) {
      const pages = getPages();
      const page = pages[index];
      if (!page) return;
      const newTitle = prompt('请输入新标题：', page.title);
      if (newTitle === null) return;
      if (newTitle.trim() === '') {
        alert('标题不能为空');
        return;
      }
      page.title = newTitle.trim();
      savePages(pages);
      updateNavPages();
      render();
    };

    // -------- 前端路由（SPA） --------
    let editor = null;
    let uploadedImageDataUrl = null;

    function render() {
      const path = window.location.pathname;
      const app = document.getElementById('app');

      if (editor) {
        editor.toTextArea();
        editor = null;
      }

      if (path === '/' || path === '/index.html') {
        app.innerHTML = `
          <h1>🎨 p5.js 脚本生成器 · 纯静态版</h1>
          <p>所有数据保存在本地浏览器中，无需服务器。</p>
          <p>编写你的 p5.js 脚本，上传图片（可选），即可生成独立的 HTML 页面，并支持预览和下载。</p>
          <p>生成的页面会保存在本地存储中，关闭浏览器后依然存在。</p>
          <p>点击导航栏的 "生成 p5.js 脚本" 开始创作。</p>
        `;
      } else if (path === '/about') {
        app.innerHTML = `
          <h1>📖 关于</h1>
          <p>此工具是纯前端应用，使用 localStorage 存储数据，无需后端。</p>
          <p>你可以编写 p5.js 脚本，上传图片素材，生成独立的 HTML 页面。</p>
          <p>支持预览、下载、删除和重命名已生成的作品。</p>
          <p>基于 CodeMirror 实现代码高亮。</p>
        `;
      } else if (path === '/generator') {
        app.innerHTML = `
          <h1>✏️ 编写 p5.js 脚本</h1>
          <p>输入页面标题和 p5.js 代码，上传图片（可选），点击生成。</p>
          <div class="form-group">
            <label for="title">页面标题</label>
            <input type="text" id="title" placeholder="例如：我的创意绘图">
          </div>
          <div class="form-group">
            <label for="script">p5.js 脚本代码</label>
            <textarea id="script" placeholder="例如：&#10;function setup() {&#10;  createCanvas(400, 400);&#10;  background(220);&#10;}&#10;function draw() {&#10;  ellipse(mouseX, mouseY, 50, 50);&#10;}"></textarea>
          </div>
          <div class="form-group">
            <label for="image">上传图片（可选，脚本可通过 <code>imageUrl</code> 加载）</label>
            <input type="file" id="image" accept="image/*" onchange="handleImageUpload(this)">
            <div id="image-preview"></div>
          </div>
          <button onclick="buildPage()">生成页面</button>
          <div id="result" class="result" style="display:none;"></div>
        `;

        setTimeout(() => {
          const textarea = document.getElementById('script');
          if (textarea && !editor) {
            editor = CodeMirror.fromTextArea(textarea, {
              mode: 'javascript',
              lineNumbers: true,
              theme: 'default',
              tabSize: 2,
              indentUnit: 2,
              autofocus: true
            });
            editor.setSize(null, 300);
          }
        }, 50);

        uploadedImageDataUrl = null;
        document.getElementById('image-preview').innerHTML = '';

        window.handleImageUpload = function(input) {
          const file = input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(e) {
            uploadedImageDataUrl = e.target.result;
            document.getElementById('image-preview').innerHTML = `<p>✅ 图片上传成功</p><img src="${e.target.result}" class="preview-img">`;
          };
          reader.readAsDataURL(file);
        };

        window.buildPage = function() {
          const title = document.getElementById('title').value.trim() || '未命名脚本';
          const script = editor ? editor.getValue().trim() : document.getElementById('script').value.trim();
          if (!script) {
            alert('请填写 p5.js 脚本代码');
            return;
          }
          const imageDataUrl = uploadedImageDataUrl || '';
          const resultDiv = document.getElementById('result');
          resultDiv.style.display = 'block';
          resultDiv.innerHTML = '正在生成...';

          const htmlContent = generatePageHtml(title, script, imageDataUrl);

          // 保存到 localStorage
          const pages = getPages();
          pages.push({
            id: Date.now(),
            title: title,
            html: htmlContent,
            timestamp: new Date().toISOString()
          });
          savePages(pages);
          updateNavPages();

          // ----- 使用 DOM 构建结果区域，避免转义问题 -----
          resultDiv.innerHTML = '';
          const msg = document.createElement('p');
          msg.textContent = '✅ 页面生成成功！已保存到本地存储。';
          resultDiv.appendChild(msg);

          const btnContainer = document.createElement('div');
          btnContainer.className = 'action-buttons';

          const previewBtn = document.createElement('button');
          previewBtn.className = 'preview';
          previewBtn.textContent = '👁️ 预览';
          previewBtn.addEventListener('click', function() {
            previewPage(htmlContent);
          });
          btnContainer.appendChild(previewBtn);

          const downloadBtn = document.createElement('button');
          downloadBtn.textContent = '📥 下载 HTML';
          downloadBtn.addEventListener('click', function() {
            downloadPage(htmlContent, `${title}.html`);
          });
          btnContainer.appendChild(downloadBtn);

          resultDiv.appendChild(btnContainer);
          // ----- 修复结束 -----

          // 重置表单
          document.getElementById('title').value = '';
          if (editor) editor.setValue('');
          else document.getElementById('script').value = '';
          uploadedImageDataUrl = '';
          document.getElementById('image-preview').innerHTML = '';
          document.getElementById('image').value = '';
        };
      } else {
        app.innerHTML = `<h1>📄 页面 ${path}</h1><p>该路径未定义。</p>`;
      }
    }

    // -------- SPA 导航拦截 --------
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link) {
        const href = link.getAttribute('href');
        if (href && href.startsWith('/') && !href.startsWith('//') && !href.startsWith('/generated/')) {
          e.preventDefault();
          history.pushState(null, '', href);
          render();
        }
      }
    });

    window.addEventListener('popstate', render);

    // -------- 初始化 --------
    window.onload = function() {
      updateNavPages();
      render();
    };
  </script>
</body>
</html>
