<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js 脚本生成器</title>
  <!-- CodeMirror 基础 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <!-- 亮色主题（默认） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css" id="cm-theme">
  <!-- 可选暗色主题（预加载，通过 id 切换） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" id="cm-theme-dark" disabled>
  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* ---------- 全局重置 ---------- */
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      transition: background 0.3s;
    }
    body.dark-mode {
      background: #1e1e1e;
      color: #ddd;
    }

    /* ---------- 顶部导航栏 ---------- */
    .top-nav {
      background: #333;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
    }
    .top-nav .left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .top-nav .hamburger {
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 0 5px;
    }
    .top-nav .title {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .top-nav .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-nav .right button {
      background: #555;
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .top-nav .right button:hover {
      background: #777;
    }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #2c2c2c;
      color: #eee;
      transition: left 0.3s ease;
      z-index: 200;
      padding-top: 60px;
      overflow-y: auto;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }
    .sidebar.open {
      left: 0;
    }
    .sidebar .nav-item {
      padding: 12px 20px;
      border-bottom: 1px solid #444;
      cursor: pointer;
    }
    .sidebar .nav-item:hover {
      background: #3a3a3a;
    }
    .sidebar .nav-item a {
      color: #eee;
      text-decoration: none;
      display: block;
    }
    .sidebar .divider {
      border-top: 2px solid #666;
      margin: 10px 0;
    }
    .sidebar .section-title {
      padding: 8px 20px;
      font-size: 0.9rem;
      color: #aaa;
      font-weight: bold;
    }
    .sidebar .page-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px 8px 30px;
      border-bottom: 1px solid #3a3a3a;
      cursor: pointer;
    }
    .sidebar .page-item:hover {
      background: #3a3a3a;
    }
    .sidebar .page-item .page-title {
      flex: 1;
      color: #eee;
      text-decoration: none;
    }
    .sidebar .page-item .actions button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 5px;
    }
    .sidebar .page-item .actions button:hover {
      color: white;
    }
    .sidebar .page-item .actions .del:hover { color: #d9534f; }
    .sidebar .page-item .actions .rename:hover { color: #5bc0de; }
    .sidebar .no-pages {
      padding: 12px 20px;
      color: #888;
      font-style: italic;
    }

    /* 遮罩层 */
    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 150;
    }
    .overlay.show {
      display: block;
    }

    /* ---------- 主内容 ---------- */
    #app {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      background: white;
      min-height: calc(100vh - 56px);
      transition: background 0.3s;
    }
    body.dark-mode #app {
      background: #2d2d2d;
      color: #ddd;
    }

    /* ---------- 表单 ---------- */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
    }
    body.dark-mode .form-group input,
    body.dark-mode .form-group textarea {
      background: #3a3a3a;
      color: #ddd;
      border-color: #555;
    }
    .form-group .CodeMirror {
      border: 1px solid #ccc;
      border-radius: 4px;
      height: 300px;
      font-size: 14px;
    }
    body.dark-mode .form-group .CodeMirror {
      border-color: #555;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
    .result {
      margin-top: 20px;
      padding: 10px;
      background: #e9f7fe;
      border-radius: 4px;
    }
    body.dark-mode .result {
      background: #2a4a5a;
    }
    .preview-img {
      max-width: 200px;
      max-height: 200px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .action-buttons button {
      background: #6c757d;
    }
    .action-buttons button.preview { background: #28a745; }
    .action-buttons button.zip { background: #17a2b8; }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <nav class="top-nav">
    <div class="left">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <span class="title">🎨 p5.js 生成器</span>
    </div>
    <div class="right">
      <button id="themeToggle">🌓 主题</button>
      <button id="exportZipBtn">📦 导出 ZIP</button>
    </div>
  </nav>

  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <div class="nav-item" data-path="/">🏠 首页</div>
    <div class="nav-item" data-path="/about">📖 关于</div>
    <div class="nav-item" data-path="/generator">✏️ 生成脚本</div>
    <div class="divider"></div>
    <div class="section-title">📄 我的脚本</div>
    <div id="sidebar-pages">
      <div class="no-pages">暂无生成的脚本</div>
    </div>
  </div>
  <div class="overlay" id="overlay"></div>

  <!-- 主内容 -->
  <div id="app">加载中...</div>

  <!-- CodeMirror -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

  <script>
    // -------- 本地存储管理 --------
    function getPages() {
      try { return JSON.parse(localStorage.getItem('p5_pages')) || []; } catch { return []; }
    }
    function savePages(pages) {
      localStorage.setItem('p5_pages', JSON.stringify(pages));
    }

    // -------- 工具函数 --------
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function generatePageHtml(title, script, imageDataUrl) {
      const safeTitle = escapeHtml(title) || '未命名页面';
      const imgVar = imageDataUrl ? `var imageUrl = "${imageDataUrl}";` : 'var imageUrl = null;';
      return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${safeTitle}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"><\/script>
</head>
<body>
  <script>
    ${imgVar}
    ${script}
  <\/script>
</body>
</html>`;
    }

    // -------- 预览 & 下载 --------
    function previewPage(htmlContent) {
      const win = window.open('', '_blank');
      if (win) {
        win.document.write(htmlContent);
        win.document.close();
      } else {
        alert('请允许弹出窗口。');
      }
    }

    function downloadPage(htmlContent, filename) {
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename || 'p5_sketch.html';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    // -------- 导出 ZIP --------
    function exportZip() {
      const pages = getPages();
      if (!pages.length) {
        alert('没有可导出的作品。');
        return;
      }
      const zip = new JSZip();
      pages.forEach((page, idx) => {
        const filename = `p5_${page.title || 'untitled'}_${idx+1}.html`.replace(/[^a-zA-Z0-9._-]/g, '_');
        zip.file(filename, page.html);
      });
      zip.generateAsync({ type: 'blob' }).then(blob => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'p5_works.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      });
    }

    // -------- 侧边栏与路由 --------
    let currentPath = '/';
    let editor = null;
    let uploadedImageDataUrl = null;
    let theme = 'light'; // 'light' or 'dark'

    // 更新侧边栏作品列表
    function updateSidebarPages() {
      const container = document.getElementById('sidebar-pages');
      const pages = getPages();
      if (!pages.length) {
        container.innerHTML = '<div class="no-pages">暂无生成的脚本</div>';
        return;
      }
      let html = '';
      pages.forEach((page, index) => {
        const title = escapeHtml(page.title);
        html += `
          <div class="page-item">
            <span class="page-title" onclick="navigateToPage(${index})">${title}</span>
            <div class="actions">
              <button class="rename" onclick="event.stopPropagation(); renamePage(${index})" title="重命名">✏️</button>
              <button class="del" onclick="event.stopPropagation(); deletePage(${index})" title="删除">🗑️</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // 导航到指定页面（当前窗口）
    function navigateToPage(index) {
      const pages = getPages();
      if (!pages[index]) return;
      const content = pages[index].html;
      // 在当前窗口显示该 HTML（利用 iframe 或直接替换内容）
      // 我们采用一个简单方式：将 app 内容替换为 iframe 显示该 HTML，或者直接渲染？
      // 但为了保持 SPA 风格，我们可以将 HTML 放入一个 div 中直接展示，但会丢失样式。
      // 更合理：在新窗口预览，但要求在当前窗口打开，我们可以用 iframe。
      // 或者我们使用一个“预览”视图，但这样会破坏路由。
      // 简单实现：直接跳转到该页面（使用 data URI），但会丢失应用状态。
      // 鉴于要求“在当前窗口切换”，我们使用 iframe 嵌入。
      const app = document.getElementById('app');
      app.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h2>预览: ${escapeHtml(pages[index].title)}</h2>
          <button onclick="render()">← 返回</button>
        </div>
        <iframe srcdoc="${escapeHtml(content).replace(/"/g, '&quot;')}" style="width:100%; height:80vh; border:1px solid #ccc; border-radius:4px;"></iframe>
      `;
      // 关闭侧边栏
      closeSidebar();
    }
    // 暴露给 onclick
    window.navigateToPage = navigateToPage;

    // 删除页面
    function deletePage(index) {
      if (!confirm('确定删除该作品吗？')) return;
      const pages = getPages();
      pages.splice(index, 1);
      savePages(pages);
      updateSidebarPages();
      // 如果当前正在预览该页，返回主页
      render();
    }
    window.deletePage = deletePage;

    // 重命名页面
    function renamePage(index) {
      const pages = getPages();
      const page = pages[index];
      if (!page) return;
      const newTitle = prompt('请输入新标题：', page.title);
      if (newTitle === null || newTitle.trim() === '') return;
      page.title = newTitle.trim();
      savePages(pages);
      updateSidebarPages();
      // 如果当前正在预览该页，刷新标题显示（但复杂，简单处理：重新渲染）
      render();
    }
    window.renamePage = renamePage;

    // 侧边栏开关
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('show');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }
    document.getElementById('hamburgerBtn').addEventListener('click', openSidebar);
    document.getElementById('overlay').addEventListener('click', closeSidebar);

    // 侧边栏导航项点击
    document.querySelectorAll('.sidebar .nav-item[data-path]').forEach(el => {
      el.addEventListener('click', function() {
        const path = this.getAttribute('data-path');
        history.pushState(null, '', path);
        render();
        closeSidebar();
      });
    });

    // 主题切换
    function toggleTheme() {
      const body = document.body;
      const lightTheme = document.getElementById('cm-theme');
      const darkTheme = document.getElementById('cm-theme-dark');
      if (theme === 'light') {
        body.classList.add('dark-mode');
        lightTheme.disabled = true;
        darkTheme.disabled = false;
        theme = 'dark';
        // 刷新编辑器主题
        if (editor) {
          editor.setOption('theme', 'dracula');
        }
      } else {
        body.classList.remove('dark-mode');
        lightTheme.disabled = false;
        darkTheme.disabled = true;
        theme = 'light';
        if (editor) {
          editor.setOption('theme', 'default');
        }
      }
    }
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    // 导出 ZIP
    document.getElementById('exportZipBtn').addEventListener('click', exportZip);

    // -------- 路由渲染 --------
    function render() {
      const path = window.location.pathname;
      const app = document.getElementById('app');

      // 清理编辑器实例
      if (editor) {
        editor.toTextArea();
        editor = null;
      }

      if (path === '/' || path === '/index.html') {
        app.innerHTML = `
          <h1>🎨 p5.js 脚本生成器</h1>
          <p>所有数据保存在本地浏览器中，无需服务器。</p>
          <p>编写 p5.js 脚本，上传图片素材，生成独立的 HTML 页面。</p>
          <p>支持预览、下载、导出 ZIP、删除和重命名作品。</p>
          <p>点击左上角菜单查看所有作品。</p>
        `;
      } else if (path === '/about') {
        app.innerHTML = `
          <h1>📖 关于</h1>
          <p>纯前端工具，基于 localStorage 存储，无需后端。</p>
          <p>使用 CodeMirror 实现代码高亮，支持亮色/暗色主题。</p>
          <p>所有作品均可导出为 ZIP 包。</p>
        `;
      } else if (path === '/generator') {
        app.innerHTML = `
          <h1>✏️ 编写 p5.js 脚本</h1>
          <p>输入页面标题和 p5.js 代码，上传图片（可选），点击生成。</p>
          <div class="form-group">
            <label for="title">页面标题</label>
            <input type="text" id="title" placeholder="例如：我的创意绘图">
          </div>
          <div class="form-group">
            <label for="script">p5.js 脚本代码</label>
            <textarea id="script" placeholder="例如：&#10;function setup() {&#10;  createCanvas(400, 400);&#10;  background(220);&#10;}&#10;function draw() {&#10;  ellipse(mouseX, mouseY, 50, 50);&#10;}"></textarea>
          </div>
          <div class="form-group">
            <label for="image">上传图片（可选，脚本可通过 <code>imageUrl</code> 加载）</label>
            <input type="file" id="image" accept="image/*" onchange="handleImageUpload(this)">
            <div id="image-preview"></div>
          </div>
          <button onclick="buildPage()">生成页面</button>
          <div id="result" class="result" style="display:none;"></div>
        `;

        // 初始化 CodeMirror
        setTimeout(() => {
          const textarea = document.getElementById('script');
          if (textarea && !editor) {
            const themeName = theme === 'dark' ? 'dracula' : 'default';
            editor = CodeMirror.fromTextArea(textarea, {
              mode: 'javascript',
              lineNumbers: true,
              theme: themeName,
              tabSize: 2,
              indentUnit: 2,
              autofocus: true
            });
            editor.setSize(null, 300);
          }
        }, 50);

        // 重置图片
        uploadedImageDataUrl = null;
        document.getElementById('image-preview').innerHTML = '';

        window.handleImageUpload = function(input) {
          const file = input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(e) {
            uploadedImageDataUrl = e.target.result;
            document.getElementById('image-preview').innerHTML = `<p>✅ 图片上传成功</p><img src="${e.target.result}" class="preview-img">`;
          };
          reader.readAsDataURL(file);
        };

        window.buildPage = function() {
          const title = document.getElementById('title').value.trim() || '未命名脚本';
          const script = editor ? editor.getValue().trim() : document.getElementById('script').value.trim();
          if (!script) {
            alert('请填写 p5.js 脚本代码');
            return;
          }
          const imageDataUrl = uploadedImageDataUrl || '';
          const resultDiv = document.getElementById('result');
          resultDiv.style.display = 'block';
          resultDiv.innerHTML = '正在生成...';

          const htmlContent = generatePageHtml(title, script, imageDataUrl);

          const pages = getPages();
          pages.push({
            id: Date.now(),
            title: title,
            html: htmlContent,
            timestamp: new Date().toISOString()
          });
          savePages(pages);
          updateSidebarPages();

          resultDiv.innerHTML = '';
          const msg = document.createElement('p');
          msg.textContent = '✅ 页面生成成功！已保存到本地存储。';
          resultDiv.appendChild(msg);

          const btnContainer = document.createElement('div');
          btnContainer.className = 'action-buttons';

          const previewBtn = document.createElement('button');
          previewBtn.className = 'preview';
          previewBtn.textContent = '👁️ 预览';
          previewBtn.addEventListener('click', function() {
            previewPage(htmlContent);
          });
          btnContainer.appendChild(previewBtn);

          const downloadBtn = document.createElement('button');
          downloadBtn.textContent = '📥 下载 HTML';
          downloadBtn.addEventListener('click', function() {
            downloadPage(htmlContent, `${title}.html`);
          });
          btnContainer.appendChild(downloadBtn);

          resultDiv.appendChild(btnContainer);

          // 重置表单
          document.getElementById('title').value = '';
          if (editor) editor.setValue('');
          else document.getElementById('script').value = '';
          uploadedImageDataUrl = '';
          document.getElementById('image-preview').innerHTML = '';
          document.getElementById('image').value = '';
        };
      } else {
        app.innerHTML = `<h1>📄 页面 ${path}</h1><p>内容未定义。</p>`;
      }
    }

    // 监听 popstate
    window.addEventListener('popstate', render);

    // 初始化
    window.onload = function() {
      updateSidebarPages();
      render();
    };
  </script>
</body>
</html>
