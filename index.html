<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>randomArt可视化创意编程</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"
      id="cm-theme-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"
      id="cm-theme-dark"
      disabled
    />

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <button
      class="hamburger-btn"
      id="hamburgerBtn"
      data-i18n-aria-label="sidebar.menuAriaLabel"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      ☰
    </button>

    <nav
      class="sidebar"
      id="sidebar"
      data-i18n-aria-label="sidebar.navAriaLabel"
    >
      <!-- 搜索框 -->
      <div class="sidebar-search">
        <input
          type="search"
          id="sidebarSearch"
          data-i18n-placeholder="sidebar.searchPlaceholder"
          data-i18n-aria-label="sidebar.searchAriaLabel"
          autocomplete="off"
        />
      </div>

      <div
        class="nav-item"
        data-path="#/"
        data-i18n="sidebar.navHome"
        role="button"
        tabindex="0"
      >
      首页
      </div>
      <div
        class="nav-item"
        data-path="#/about"
        data-i18n="sidebar.navAbout"
        role="button"
        tabindex="0"
      >
      关于
      </div>
      <div
        class="nav-item"
        data-path="#/ai"
        data-i18n="sidebar.navAI"
        role="button"
        tabindex="0"
      >
      AI助手
      </div>
      <div
        class="nav-item"
        data-path="#/generator"
        data-i18n="sidebar.navGenerator"
        role="button"
        tabindex="0"
      >
      编写脚本
      </div>
      <div class="divider"></div>
      <div class="section-title" data-i18n="sidebar.myScripts">
      我的脚本
      </div>
      <div id="sidebar-pages">
        <div class="no-pages" data-i18n="sidebar.emptyPages">
          暂无生成的脚本
        </div>
      </div>

      <!-- 底部 -->
      <div class="sidebar-footer">
        <div class="footer-row">
          <div
            class="nav-item footer-item"
            id="exportZipSidebar"
            role="button"
            tabindex="0"
            data-i18n="sidebar.exportZip"
          >
          导出ZIP
          </div>
          <div class="footer-vdivider"></div>
          <div
            class="nav-item footer-item"
            id="themeToggleSidebar"
            role="button"
            tabindex="0"
            data-i18n="sidebar.themeToggle"
          >
          切换主题
          </div>
        </div>
      </div>
    </nav>
    <div class="overlay" id="overlay"></div>

    <main id="app">加载中…</main>

    <div
      class="modal-backdrop"
      id="modalBackdrop"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" id="modalBox"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>

    <!-- 主脚本 -->
    <script src="js/script.js"></script>
  </body>
</html>
